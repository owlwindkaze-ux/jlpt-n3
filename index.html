<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4b7a">
<title>JLPT N3 100日学習｜タブレット版</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#172033;--muted:#667085;--line:#d9dee8;--accent:#1f4b7a;--accent2:#eaf1f8;--ok:#18794e;--bad:#b42318;--warn:#9a6700;--soft:#f9fafb;--shadow:0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;line-height:1.65}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.app{max-width:1100px;margin:0 auto;padding:12px 12px 48px}.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,250,.96);backdrop-filter:blur(8px);padding:8px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:1.15rem;margin:0}.brand small{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:10px;min-height:44px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.danger{color:var(--bad)}.btn.ghost{background:transparent}.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.homegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.stat .num{font-size:1.5rem;font-weight:800}.stat .label{font-size:.82rem;color:var(--muted)}.profile{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;align-items:end;margin-top:14px}.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}.week{margin-top:18px}.weekhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.weekhead h2{font-size:1.02rem;margin:0}.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.daycard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;min-height:112px;position:relative}.daycard.done{border-color:#8bc6aa;background:#f6fbf8}.daycard.today{outline:3px solid #d7e5f6}.daycard .dtitle{font-weight:800}.daycard .theme{font-size:.86rem;color:var(--muted);margin-top:3px;min-height:2.8em}.daycard .meta{font-size:.78rem;color:var(--muted);margin-top:8px}.daycard .score{font-size:.82rem;font-weight:700;color:var(--ok);margin-top:4px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:var(--accent2);color:var(--accent);font-size:.78rem;font-weight:700}.paneltitle{font-size:1.05rem;font-weight:800;margin:0 0 8px}.note{font-size:.88rem;color:var(--muted)}.progress{height:10px;background:#e9edf3;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent);width:0}.hidden{display:none!important}
.daytop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin:14px 0}.daytop h2{margin:0 0 4px;font-size:1.25rem}.timerbox{min-width:180px;text-align:center}.timer{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}.timer.over{color:var(--bad)}.modebox{margin-bottom:12px}.modebtn.active{background:var(--accent2);border-color:#9ebadd;color:var(--accent);font-weight:700}.qwrap{display:grid;grid-template-columns:220px 1fr;gap:12px}.qnav{align-self:start;position:sticky;top:72px}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.qnum{min-height:36px;border:1px solid var(--line);background:#fff;border-radius:8px}.qnum.answered{background:#eef8f2;border-color:#9acbad}.qnum.current{outline:2px solid var(--accent)}.qnum.wrong{background:#fff1f0;border-color:#f0a39d}.qmain{min-width:0}.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.instruction{font-size:.84rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:9px;margin-bottom:12px}.passage{white-space:pre-wrap;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;max-height:330px;overflow:auto}.stem{font-size:1.08rem;font-weight:650;margin:12px 0}.stem u{text-decoration-thickness:2px;text-underline-offset:3px}.sceneimg{display:block;max-width:100%;max-height:300px;margin:8px auto 14px;border:1px solid var(--line);border-radius:8px;background:#fff}.audioBox{background:#f8fbff;border:1px solid #cbdced;border-radius:10px;padding:12px;margin:10px 0 14px}.audioStatus{font-size:.82rem;color:var(--muted);margin-top:6px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{display:flex;align-items:flex-start;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px;min-height:56px}.option .onum{width:30px;height:30px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:#f0f3f7;font-weight:800}.option.selected{border-color:var(--accent);background:var(--accent2)}.option.correct{border-color:var(--ok);background:#effaf4}.option.incorrect{border-color:var(--bad);background:#fff1f0}.audioOnly .option{justify-content:center;align-items:center;font-size:1.15rem}.feedback{margin-top:14px;border-radius:10px;padding:13px;background:#f8fafc;border:1px solid var(--line)}.feedback.good{border-left:5px solid var(--ok)}.feedback.bad{border-left:5px solid var(--bad)}.feedback .id{margin-top:8px;color:#344054}.feedback .point{margin-top:8px;color:var(--muted);font-size:.9rem}.qactions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}.result h2{margin-top:0}.scorebig{font-size:2rem;font-weight:900}.breakdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.break{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.wronglist details{border:1px solid var(--line);border-radius:10px;background:#fff;margin:8px 0;padding:10px}.wronglist summary{cursor:pointer;font-weight:700}.footerTools{margin-top:20px}.modalShade{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:14px;z-index:40}.modal{max-width:620px;width:100%;background:#fff;border-radius:14px;padding:18px;max-height:85%;overflow:auto}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;right:16px;bottom:16px;background:#172033;color:white;border-radius:10px;padding:10px 14px;z-index:50;max-width:340px}
@media(max-width:850px){.homegrid{grid-template-columns:repeat(2,1fr)}.days{grid-template-columns:repeat(3,1fr)}.profile{grid-template-columns:1fr 1fr}.qwrap{grid-template-columns:1fr}.qnav{position:static}.qgrid{grid-template-columns:repeat(10,1fr)}}
@media(max-width:560px){.app{padding:8px 8px 36px}.brand small{display:none}.days{grid-template-columns:repeat(2,1fr)}.profile{grid-template-columns:1fr}.options{grid-template-columns:1fr}.qgrid{grid-template-columns:repeat(6,1fr)}.breakdown{grid-template-columns:repeat(2,1fr)}.daytop{grid-template-columns:1fr}.timerbox{text-align:left}.settingsgrid{grid-template-columns:1fr}.btn{padding:9px 11px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <div><h1>JLPT N3 100日学習｜タブレット版</h1><small>2018年版JLPT N3の設問スタイルを主基準にしたオリジナル教材</small></div>
      <div class="btnrow"><button class="btn" id="homeBtn" type="button">ホーム</button><button class="btn" id="settingsBtn" type="button">設定</button></div>
    </div>
  </div>

  <main id="homeView">
    <div class="card" style="margin-top:14px">
      <div class="profile">
        <div class="field"><label>学習者名（名前ごとに履歴を保存）</label><input id="profileName" value="学習者" maxlength="40"></div>
        <div class="field"><label>表示</label><select id="dayFilter"><option value="all">すべてのDay</option><option value="unfinished">未完了だけ</option><option value="completed">完了だけ</option></select></div>
        <div class="btnrow"><button class="btn primary" id="profileApply" type="button">この名前で使う</button></div>
      </div>
      <div style="margin-top:14px"><div class="progress"><span id="progressBar"></span></div><div class="note" id="progressText" style="margin-top:5px"></div></div>
    </div>
    <div class="homegrid" id="stats"></div>
    <div id="todayBox" class="card hidden" style="margin-top:14px"></div>
    <div id="weeks"></div>
    <div class="card footerTools">
      <div class="paneltitle">学習履歴の保存・管理</div>
      <div class="btnrow"><button class="btn" id="csvBtn" type="button">CSVで保存</button><button class="btn" id="jsonBtn" type="button">バックアップ保存</button><label class="btn" for="importFile">バックアップ読込</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"><button class="btn danger" id="resetBtn" type="button">この学習者の履歴を消す</button></div>
      <div class="note" style="margin-top:8px">履歴はこの端末・このブラウザ内に保存されます。定期的に「バックアップ保存」することをおすすめします。</div>
    </div>
  </main>

  <main id="dayView" class="hidden">
    <div class="daytop">
      <div><div class="btnrow"><span class="pill" id="dayDate"></span><span class="pill" id="dayTarget"></span></div><h2 id="dayTitle"></h2><div class="note" id="daySub"></div></div>
      <div class="card timerbox"><div class="note">経過時間</div><div class="timer" id="timer">00:00</div><div class="note" id="timerGoal"></div></div>
    </div>
    <div id="startPanel" class="card">
      <div class="paneltitle">解答方法を選んで開始</div>
      <div class="modebox btnrow"><button type="button" class="btn modebtn active" data-mode="test">試験モード</button><button type="button" class="btn modebtn" data-mode="study">学習モード</button></div>
      <div class="note">試験モード：最後にまとめて採点します。学習モード：答えるたびに正解と解説を確認できます。</div>
      <div class="btnrow" style="margin-top:12px"><button class="btn primary" id="startBtn" type="button">開始する</button><button class="btn hidden" id="resumeBtn" type="button">途中から続ける</button><button class="btn hidden danger" id="discardDraftBtn" type="button">途中データを削除</button></div>
    </div>
    <div id="quizPanel" class="hidden">
      <div class="qwrap">
        <aside class="card qnav"><div class="paneltitle">問題</div><div id="qgrid" class="qgrid"></div><div class="note" id="answerProgress" style="margin-top:8px"></div></aside>
        <section class="card qmain">
          <div class="qhead"><span class="pill" id="sectionChip"></span><strong id="qCounter"></strong></div>
          <div class="instruction" id="instruction"></div>
          <div class="passage hidden" id="passage"></div>
          <img id="sceneImg" class="sceneimg hidden" alt="聴解問題の場面図">
          <div class="audioBox hidden" id="audioBox"><div class="btnrow"><button class="btn primary" id="audioBtn" type="button">▶ 音声を再生</button><button class="btn" id="audioStopBtn" type="button">■ 停止</button></div><div class="audioStatus" id="audioStatus"></div></div>
          <div class="stem" id="stem"></div>
          <div class="options" id="options"></div>
          <div class="feedback hidden" id="feedback"></div>
          <div class="qactions"><button class="btn" id="prevBtn" type="button">← 前の問題</button><div class="btnrow"><button class="btn" id="nextBtn" type="button">次の問題 →</button><button class="btn ok" id="submitBtn" type="button">採点する</button></div></div>
        </section>
      </div>
    </div>
    <div id="resultPanel" class="card result hidden"></div>
  </main>
</div>

<div id="settingsModal" class="modalShade hidden"><div class="modal"><div class="paneltitle">設定</div><div class="settingsgrid"><div class="field"><label>音声速度</label><select id="speechRate"><option value="0.85">0.85倍</option><option value="1" selected>1.0倍</option><option value="1.1">1.1倍</option></select></div><div class="field"><label>ナレーター音声</label><select id="voiceNarrator"></select></div><div class="field"><label>女性音声</label><select id="voiceFemale"></select></div><div class="field"><label>男性音声</label><select id="voiceMale"></select></div></div><div class="note" style="margin-top:10px">端末に登録されている日本語読み上げ音声を利用します。Chrome / Edge 推奨です。</div><div class="btnrow" style="margin-top:14px"><button class="btn primary" id="voiceTestBtn" type="button">音声テスト</button><button class="btn" id="settingsClose" type="button">閉じる</button></div></div></div>
<div id="toast" class="toast hidden" aria-live="polite"></div>

<script id="courseData" type="application/json">{"days":[{"day":1,"date":"8月28日","theme":"N3総合診断","target":30,"questions":[{"q":1,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"担当者から詳しい説明がないので、今は事故の（　　　）がよく分かりません。","stem_html":"担当者から詳しい説明がないので、今は事故の（　　　）がよく分かりません。","context":"","options":["状況","方法","支度","結果"],"answer":1,"explanation":{"jp":"「状況」は、今どうなっているかという状態です。ここでは事故の詳しい状態がまだ分からない、という意味です。","id":"「状況」berarti keadaan atau kondisi saat ini. Kalimat ini menyatakan bahwa keadaan rinci tentang kecelakaan belum diketahui.","point":"「詳しい状況」「現在の状況」という組み合わせを確認する。"}},{"q":2,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"台風が近づいているため、明日の行事を予定どおり行うかどうかは、朝の天気を見て（　　　）します。","stem_html":"台風が近づいているため、明日の行事を予定どおり行うかどうかは、朝の天気を見て（　　　）します。","context":"","options":["準備","判断","連絡","支度"],"answer":2,"explanation":{"jp":"「判断する」は、状況を見て考え、どうするか決めることです。","id":"「判断する」berarti menilai keadaan lalu memutuskan apa yang akan dilakukan.","point":"「判断する」の目的語・場面を確認する。"}},{"q":3,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この仕事を一人でするのは難しいので、もう一人手伝う人が（　　　）です。","stem_html":"この仕事を一人でするのは難しいので、もう一人手伝う人が（　　　）です。","context":"","options":["必要","原因","状況","方法"],"answer":1,"explanation":{"jp":"「必要です」は「なくてはならない」という意味です。","id":"「必要」berarti diperlukan atau harus ada.","point":"「人が必要」「時間が必要」などを確認。"}},{"q":4,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"新しい言葉を覚える（　　　）として、例文を作って声に出して読むのも効果的です。","stem_html":"新しい言葉を覚える（　　　）として、例文を作って声に出して読むのも効果的です。","context":"","options":["結果","方法","状況","判断"],"answer":2,"explanation":{"jp":"「方法」は、どうやってするか、というやり方です。","id":"「方法」berarti cara atau metode melakukan sesuatu.","point":"「～する方法として」の形。"}},{"q":5,"section":"vocab","instruction":"問題4　　　　　のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","stem":"会議は来週の火曜日に変更されました。","stem_html":"会議は来週の火曜日に<u>変更</u>されました。","context":"","options":["会議は中止になりました","会議の日が変わりました","会議の場所が変わりました","会議の参加者が増えました"],"answer":2,"explanation":{"jp":"「変更されました」は、決まっていた内容が別の内容に変わったという意味です。ここでは曜日が変わりました。","id":"「変更されました」berarti sesuatu yang sudah ditetapkan berubah. Di sini hari rapat berubah.","point":"言い換え問題。"}},{"q":6,"section":"vocab","instruction":"問題4　　　　　のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","stem":"提出する前に、名前と日付に間違いがないか確かめてください。","stem_html":"提出する前に、名前と日付に間違いがないか<u>確かめて</u>ください。","context":"","options":["連絡してください","確認してください","判断してください","準備してください"],"answer":2,"explanation":{"jp":"「確かめる」は「確認する」と近い意味です。","id":"「確かめる」memiliki arti dekat dengan 「確認する」, yaitu memastikan atau memeriksa.","point":"類義語を文脈で判断させる。"}},{"q":7,"section":"vocab","instruction":"問題4　　　　　のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","stem":"予定が決まったら、できるだけ早く私にも知らせてください。","stem_html":"予定が決まったら、できるだけ早く私にも<u>知らせて</u>ください。","context":"","options":["私にも確認してください","私にも連絡してください","私にも準備してください","私にも判断してください"],"answer":2,"explanation":{"jp":"「知らせる」は、この文では「連絡する」と近い意味です。","id":"Dalam konteks ini, 「知らせる」berarti hampir sama dengan 「連絡する」, yaitu memberi kabar.","point":"言い換え。"}},{"q":8,"section":"vocab","instruction":"問題5　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"支度","stem_html":"支度","context":"","options":["出かける支度をしてから、家を出ました","会議の結果を支度しました","先生に支度を電話しました","天気を見て支度しました"],"answer":1,"explanation":{"jp":"「支度」は、出かける前や食事の前など、生活の中で必要な準備をすることによく使います。","id":"「支度」sering digunakan untuk persiapan sehari-hari, misalnya bersiap untuk pergi atau menyiapkan makan.","point":"「準備」と「支度」の使い分け。"}},{"q":9,"section":"vocab","instruction":"問題5　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"結果","stem_html":"結果","context":"","options":["話し合った結果、新しい方法を試すことになりました","結果を駅まで歩きました","先生に結果して質問しました","旅行の結果をかばんに入れました"],"answer":1,"explanation":{"jp":"「～た結果、…」は、ある行動のあとにどうなったかを表す自然な使い方です。","id":"Pola 「～た結果」menunjukkan hasil setelah suatu tindakan dilakukan.","point":"用法問題。"}},{"q":10,"section":"vocab","instruction":"問題5　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"準備","stem_html":"準備","context":"","options":["研修で使う資料を前の日までに準備しておきます","研修の時間を準備に遅れました","先生の意見を準備しました","雨が降るかどうかを準備しました"],"answer":1,"explanation":{"jp":"「準備する」は、これから行うことのために必要な物やことを整えるときに使います。","id":"「準備する」digunakan untuk menyiapkan barang atau hal yang diperlukan sebelum melakukan sesuatu.","point":"用法。"}},{"q":11,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"忘れ物をしない（　　　）、出かける前に持ち物を確認しています。","stem_html":"忘れ物をしない（　　　）、出かける前に持ち物を確認しています。","context":"","options":["ために","ように","ほど","ばかり"],"answer":2,"explanation":{"jp":"「～ように」は、忘れない・できるなど、状態や可能を目標にするときに使います。","id":"「～ように」dipakai untuk tujuan berupa keadaan atau kemampuan, misalnya agar tidak lupa.","point":"「ために」と「ように」の区別。"}},{"q":12,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この施設では、出勤したら最初に手を洗う（　　　）。","stem_html":"この施設では、出勤したら最初に手を洗う（　　　）。","context":"","options":["ことになっています","ことにしました","ようになりました","ところです"],"answer":1,"explanation":{"jp":"「ことになっている」は、規則・決まり・予定を表します。","id":"「ことになっている」menyatakan peraturan, ketentuan, atau jadwal yang sudah ditetapkan.","point":"規則の表現。"}},{"q":13,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"日本にいる（　　　）、できるだけ多くの場所へ行ってみたいです。","stem_html":"日本にいる（　　　）、できるだけ多くの場所へ行ってみたいです。","context":"","options":["うちに","ばかりに","ところで","ほどに"],"answer":1,"explanation":{"jp":"「～うちに」は、その状態が続いている間に何かをする、という意味です。","id":"「～うちに」berarti melakukan sesuatu selama keadaan tersebut masih berlangsung.","point":"時間的範囲。"}},{"q":14,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"さっき昼ご飯を食べた（　　　）なのに、もうおなかがすきました。","stem_html":"さっき昼ご飯を食べた（　　　）なのに、もうおなかがすきました。","context":"","options":["ほど","ばかり","うち","ため"],"answer":2,"explanation":{"jp":"「～たばかり」は、あることをしてからあまり時間がたっていないことを表します。","id":"「～たばかり」berarti baru saja melakukan sesuatu.","point":"N3頻出。"}},{"q":15,"section":"grammar","instruction":"問題2　つぎの文の ★ に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この本を読んで　＿＿＿　＿＿＿　★　＿＿＿　なりました。","stem_html":"この本を読んで　＿＿＿　＿＿＿　★　＿＿＿　なりました。","context":"","options":["前より","日本の文化が","分かる","ように"],"answer":3,"explanation":{"jp":"正しい語順は「この本を読んで、日本の文化が前より分かるようになりました」です。★には「分かる」が入ります。","id":"Urutan yang benar adalah 「この本を読んで、日本の文化が前より分かるようになりました」. Bagian ★ adalah 「分かる」.","point":"★の位置だけでなく、文全体を組み立ててから選ばせる。"}},{"q":16,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"先生は、ミナさんに何をするように言いましたか。","stem_html":"先生は、ミナさんに何をするように言いましたか。","context":"ミナさんは、覚えた単語を増やすために、毎日新しい言葉を30個ずつ覚えていました。しかし、一週間後にもう一度確認すると、意味を思い出せない言葉がたくさんありました。そこで先生は、「新しい言葉の数を少し減らして、その代わり、前の日に覚えた言葉を必ず使って短い文を作ってみてください」と言いました。ミナさんは、その方法を二週間続けたところ、以前より忘れる言葉が少なくなりました。","options":["毎日30個以上覚える","新しい言葉を覚えるのをやめる","新しい言葉を少し減らし、前日の言葉を文で使う","一週間ごとに先生にテストしてもらう"],"answer":3,"explanation":{"jp":"先生は「新しい言葉の数を少し減らして」「前の日に覚えた言葉を使って短い文を作る」と言っています。","id":"Guru menyarankan mengurangi jumlah kosakata baru dan menggunakan kosakata hari sebelumnya dalam kalimat pendek.","point":"複数情報をまとめて選ぶ。"}},{"q":17,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"ミナさんが勉強方法を変えたのはなぜですか。","stem_html":"ミナさんが勉強方法を変えたのはなぜですか。","context":"ミナさんは、覚えた単語を増やすために、毎日新しい言葉を30個ずつ覚えていました。しかし、一週間後にもう一度確認すると、意味を思い出せない言葉がたくさんありました。そこで先生は、「新しい言葉の数を少し減らして、その代わり、前の日に覚えた言葉を必ず使って短い文を作ってみてください」と言いました。ミナさんは、その方法を二週間続けたところ、以前より忘れる言葉が少なくなりました。","options":["勉強する時間がなくなったから","覚えたはずの言葉を多く忘れていたから","先生に30個では少なすぎると言われたから","短い文を作るのが得意だったから"],"answer":2,"explanation":{"jp":"「一週間後に…意味を思い出せない言葉がたくさんあった」ことが理由です。","id":"Alasannya adalah banyak kosakata yang sudah dipelajari tidak dapat diingat kembali setelah satu minggu.","point":"因果関係。"}},{"q":18,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"この文章の内容と合っているものはどれですか。","stem_html":"この文章の内容と合っているものはどれですか。","context":"ミナさんは、覚えた単語を増やすために、毎日新しい言葉を30個ずつ覚えていました。しかし、一週間後にもう一度確認すると、意味を思い出せない言葉がたくさんありました。そこで先生は、「新しい言葉の数を少し減らして、その代わり、前の日に覚えた言葉を必ず使って短い文を作ってみてください」と言いました。ミナさんは、その方法を二週間続けたところ、以前より忘れる言葉が少なくなりました。","options":["新しい言葉は多ければ多いほどよい","復習より新しい言葉を覚えることが大切だ","覚えた言葉を使う練習も記憶に役立つ", tions":["に対して","に比べて","によって","について"],"answer":2,"explanation":{"jp":"「～に比べて」は二つを比較するときに使います。","id":"「～に比べて」digunakan untuk membandingkan dua hal.","point":"比較。"}},{"q":5,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"日本で働き始めたばかりの人（　　　）、役所の手続きは難しいことがあります。","stem_html":"日本で働き始めたばかりの人（　　　）、役所の手続きは難しいことがあります。","context":"","options":["にとって","によって","に対して","について"],"answer":1,"explanation":{"jp":"「～にとって」は、その人の立場から見た評価を表します。","id":"「～にとって」menunjukkan penilaian dari sudut pandang seseorang.","point":"立場。"}},{"q":6,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"申込書は金曜日の5時（　　　）提出してください。","stem_html":"申込書は金曜日の5時（　　　）提出してください。","context":"","options":["まで","までに","しか","ほど"],"answer":2,"explanation":{"jp":"「までに」は締切を表します。「5時より前のどこかで提出する」という意味です。","id":"「までに」menunjukkan batas waktu; harus selesai sebelum atau pada waktu tersebut.","point":"「まで」と「までに」。"}},{"q":7,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"今日は忙しくて、昼ご飯を食べる時間が10分（　　　）ありませんでした。","stem_html":"今日は忙しくて、昼ご飯を食べる時間が10分（　　　）ありませんでした。","context":"","options":["ほど","しか","さえ","こそ"],"answer":2,"explanation":{"jp":"「～しか～ない」は「それだけで、それ以上ない」という限定です。","id":"Pola 「～しか～ない」menunjukkan batasan: hanya sebanyak itu dan tidak lebih.","point":"しか＋否定。"}},{"q":8,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"忙しい日は、昼ご飯（　　　）食べられないことがあります。","stem_html":"忙しい日は、昼ご飯（　　　）食べられないことがあります。","context":"","options":["こそ","ほど","さえ","しか"],"answer":3,"explanation":{"jp":"「～さえ」は「普通ならできることまで」という強い例を表します。","id":"「～さえ」menunjukkan contoh ekstrem, bahkan sesuatu yang biasanya mudah dilakukan.","point":"さえ。"}},{"q":9,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"私は健康のために、毎日できるだけ階段を使う（　　　）。","stem_html":"私は健康のために、毎日できるだけ階段を使う（　　　）。","context":"","options":["ことになっています","ようにしています","ところです","ばかりです"],"answer":2,"explanation":{"jp":"「ようにしている」は、自分で意識して習慣として続けていることを表します。","id":"「ようにしている」menyatakan kebiasaan yang sengaja diusahakan sendiri.","point":"習慣。"}},{"q":10,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この町へ来る（　　　）、駅前の景色が少しずつ変わっていると感じます。","stem_html":"この町へ来る（　　　）、駅前の景色が少しずつ変わっていると感じます。","context":"","options":["たびに","ところに","ばかりで","うちで"],"answer":1,"explanation":{"jp":"「～たびに」は、そのことをする毎回、同じようなことが起こる意味です。","id":"「～たびに」berarti setiap kali melakukan sesuatu.","point":"反復。"}},{"q":11,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"今、ちょうど昼ご飯を食べ終わった（　　　）です。","stem_html":"今、ちょうど昼ご飯を食べ終わった（　　　）です。","context":"","options":["ばかり","ところ","うち","ほど"],"answer":2,"explanation":{"jp":"「～たところ」は、動作がちょうど終わった直後を表します。","id":"「～たところ」menunjukkan tepat setelah suatu tindakan selesai.","point":"ところ。"}},{"q":12,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"日本へ来てまだ一か月（　　　）なので、分からないことがたくさんあります。","stem_html":"日本へ来てまだ一か月（　　　）なので、分からないことがたくさんあります。","context":"","options":["ばかり","ところ","うち","たび"],"answer":1,"explanation":{"jp":"数量＋「ばかり」は「だいたいそれくらい」という意味にもなります。ここでは来て間もないことを表します。","id":"「ばかり」setelah jumlah dapat berarti kira-kira sebanyak itu; di sini menunjukkan baru sekitar satu bulan.","point":"ばかり。"}},{"q":13,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"若い（　　　）、いろいろなことに挑戦したほうがいいと思います。","stem_html":"若い（　　　）、いろいろなことに挑戦したほうがいいと思います。","context":"","options":["ところに","ばかりに","うちに","たびに"],"answer":3,"explanation":{"jp":"「若いうちに」は、若い状態が続いている間に、という意味です。","id":"「若いうちに」berarti selama masih muda.","point":"うちに。"}},{"q":14,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"事故が起きた（　　　）、詳しい原因はまだ分かっていません。","stem_html":"事故が起きた（　　　）、詳しい原因はまだ分かっていません。","context":"","options":["ことになって","ばかりで","たびに","ようにして"],"answer":2,"explanation":{"jp":"「～たばかりで」は、起きてから時間がたっていないため、まだ情報が少ない状況に合います。","id":"「～たばかりで」cocok karena kejadian baru saja terjadi dan informasinya belum lengkap.","point":"文脈。"}},{"q":15,"section":"grammar","instruction":"問題2　つぎの文の ★ に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"私は健康のために　＿＿＿　＿＿＿　★　＿＿＿　ようにしています。","stem_html":"私は健康のために　＿＿＿　＿＿＿　★　＿＿＿　ようにしています。","context":"","options":["できるだけ","駅まで","歩いて","行く"],"answer":3,"explanation":{"jp":"自然な語順は「私は健康のために できるだけ 駅まで 歩いて 行く ようにしています」。★は「歩いて」です。","id":"Urutan alami adalah 「できるだけ 駅まで 歩いて 行く」. Bagian ★ adalah 「歩いて」.","point":"文の組み立て。"}},{"q":16,"section":"grammar","instruction":"問題2　つぎの文の ★ に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この資料は　＿＿＿　＿＿＿　★　＿＿＿　作られています。","stem_html":"この資料は　＿＿＿　＿＿＿　★　＿＿＿　作られています。","context":"","options":["外国人にも","内容が","分かる","ように"],"answer":3,"explanation":{"jp":"自然な語順は「この資料は 外国人にも 内容が 分かる ように 作られています」。★は「分かる」です。","id":"Urutan alami adalah 「外国人にも 内容が 分かる ように」. Bagian ★ adalah 「分かる」.","point":"文の組み立て。"}},{"q":17,"section":"grammar","instruction":"問題2　つぎの文の ★ に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"毎日練習して　＿＿＿　＿＿＿　★　＿＿＿　なりました。","stem_html":"毎日練習して　＿＿＿　＿＿＿　★　＿＿＿　なりました。","context":"","options":["日本語が","前より","話せる","ように"],"answer":3,"explanation":{"jp":"正しい語順は「毎日練習して、日本語が前より話せるようになりました」です。★には「話せる」が入ります。","id":"Urutan yang benar adalah 「毎日練習して、日本語が前より話せるようになりました」. Bagian ★ adalah 「話せる」.","point":"可能形＋「ようになる」のまとまりを確認する。"}},{"q":18,"section":"grammar","instruction":"問題3　つぎの文章を読んで、文章全体の内容を考えて、（18）から（20）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"（18）","stem_html":"（18）","context":"最近、私は朝に勉強するようにしています。以前は仕事が終わってから勉強していました。（18）、疲れている日は集中できず、予定したところまで進まないことがよくありました。そこで、30分早く起きて勉強することにしました。朝は時間が短いので、前の日に「明日は何をするか」を決めておきます。（19）、短い時間でも迷わず始められます。まだ始めて二週間ですが、夜より続けやすいと感じています。（20）、忙しい日でも無理をしすぎないようにしています。","options":["そのため","しかし","例えば","つまり"],"answer":2,"explanation":{"jp":"前文は「夜に勉強していた」、後文は「疲れて集中できない」という問題点なので、逆接の「しかし」が合います。","id":"Bagian setelahnya menunjukkan masalah yang berlawanan dengan rencana belajar malam, sehingga 「しかし」 paling sesuai.","point":"文章文法。"}},{"q":19,"section":"grammar","instruction":"問題3　つぎの文章を読んで、文章全体の内容を考えて、（18）から（20）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"（19）","stem_html":"（19）","context":"最近、私は朝に勉強するようにしています。以前は仕事が終わってから勉強していました。（18）、疲れている日は集中できず、予定したところまで進まないことがよくありました。そこで、30分早く起きて勉強することにしました。朝は時間が短いので、前の日に「明日は何をするか」を決めておきます。（19）、短い時間でも迷わず始められます。まだ始めて二週間ですが、夜より続けやすいと感じています。（20）、忙しい日でも無理をしすぎないようにしています。","options":["そのため","ところが","一方","それでも"],"answer":1,"explanation":{"jp":"前日に内容を決めておくことが原因で、すぐ始められるという結果なので「そのため」です。","id":"Menentukan materi sehari sebelumnya menyebabkan bisa langsung mulai; jadi 「そのため」 tepat.","point":"因果。"}},{"q":20,"section":"grammar","instruction":"問題3　つぎの文章を読んで、文章全体の内容を考えて、（18）から（20）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"（20）","stem_html":"（20）","context":"最近、私は朝に勉強するようにしています。以前は仕事が終わってから勉強していました。（18）、疲れている日は集中できず、予定したところまで進まないことがよくありました。そこで、30分早く起きて勉強することにしました。朝は時間が短いので、前の日に「明日は何をするか」を決めておきます。（19）、短い時間でも迷わず始められます。まだ始めて二週間ですが、夜より続けやすいと感じています。（20）、忙しい日でも無理をしすぎないようにしています。","options":["ただし","つまり","例えば","そこで"],"answer":1,"explanation":{"jp":"朝学習を肯定したあとに「無理をしすぎない」という条件・注意を加えるため「ただし」が自然です。","id":"Setelah menyatakan manfaat belajar pagi, penulis menambahkan batasan/perhatian, sehingga 「ただし」 tepat.","point":"追加条件。"}}],"iso":"2026-08-31","date_label":"8月31日"},{"day":5,"date":"9月1日","theme":"読解","target":25,"questions":[{"q":1,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"新しい会議方法では、参加者は会議の前に何をしますか。","stem_html":"新しい会議方法では、参加者は会議の前に何をしますか。","context":"会社では今月から、会議の時間を短くするため、資料を会議の前日までに全員へ送ることになった。参加者は資料を先に読み、質問したい点をメモしておく。会議では資料を最初から説明するのではなく、質問や意見のある部分だけを話し合う。始めて一週間だが、以前より会議が早く終わる日が増えた。一方、資料を事前に読まずに参加する人がいると、話し合いが進まないという問題も出ている。","options":["資料を作り直す","資料を読み、質問点を考える","会議の内容を全員に説明する","質問がない場合は参加しない"],"answer":2,"explanation":{"jp":"資料を前もって読み、質問したい点をメモします。","id":"Peserta membaca materi terlebih dahulu dan mencatat hal yang ingin ditanyakan.","point":"必要行動。"}},{"q":2,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"新しい方法の問題点として述べられているのは何ですか。","stem_html":"新しい方法の問題点として述べられているのは何ですか。","context":"会社では今月から、会議の時間を短くするため、資料を会議の前日までに全員へ送ることになった。参加者は資料を先に読み、質問したい点をメモしておく。会議では資料を最初から説明するのではなく、質問や意見のある部分だけを話し合う。始めて一週間だが、以前より会議が早く終わる日が増えた。一方、資料を事前に読まずに参加する人がいると、話し合いが進まないという問題も出ている。","options":["会議が以前より長くなった","資料を送ることができない","事前に資料を読まない人がいると話が進まない","質問をする時間がなくなった"],"answer":3,"explanation":{"jp":"本文の最後に、資料を事前に読まない人がいると話し合いが進まないとあります。","id":"Masalahnya adalah diskusi tidak maju jika ada peserta yang belum membaca materi sebelumnya.","point":"問題点。"}},{"q":3,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が勉強方法を変えたのはなぜですか。","stem_html":"筆者が勉強方法を変えたのはなぜですか。","context":"私は日本語のニュースを毎日聞くことにしている。最初は分からない言葉が出るたびに音声を止め、辞書で調べていた。しかし、それでは10分のニュースを聞くのに30分以上かかり、続けるのが大変だった。今は一回目は止めずに最後まで聞き、何について話していたかを考える。二回目に、重要だと思った部分だけをもう一度聞くようにしている。全部の言葉は分からなくても、以前より内容をつかめるようになった。","options":["ニュースが簡単すぎたから","辞書を使うと時間がかかり、続けにくかったから","二回聞くことを先生に禁止されたから","全部の言葉が分かるようになったから"],"answer":2,"explanation":{"jp":"一語ずつ止めて調べると時間がかかり、続けるのが大変だったからです。","id":"Karena menghentikan audio dan mencari setiap kata memakan banyak waktu dan sulit dilanjutkan.","point":"理由。"}},{"q":4,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"現在、筆者は一回目にニュースを聞くとき、何を大切にしていますか。","stem_html":"現在、筆者は一回目にニュースを聞くとき、何を大切にしていますか。","context":"私は日本語のニュースを毎日聞くことにしている。最初は分からない言葉が出るたびに音声を止め、辞書で調べていた。しかし、それでは10分のニュースを聞くのに30分以上かかり、続けるのが大変だった。今は一回目は止めずに最後まで聞き、何について話していたかを考える。二回目に、重要だと思った部分だけをもう一度聞くようにしている。全部の言葉は分からなくても、以前より内容をつかめるようになった。","options":["分からない単語を全部書くこと","文法を一つずつ確認すること","全体として何について話しているか考えること","音声を何度も止めること"],"answer":3,"explanation":{"jp":"一回目は止めずに最後まで聞き、「何について話していたか」を考えます。","id":"Pada dengar pertama, penulis tidak berhenti dan memikirkan topik keseluruhan berita.","point":"概要把握。"}},{"q":5,"section":"reading","instruction":"問題6　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"以前、筆者が質問しないことがあったのはなぜですか。","stem_html":"以前、筆者が質問しないことがあったのはなぜですか。","context":"新しい仕事を覚えるとき、私は以前、分からないことがあっても「何度も聞くと迷惑かもしれない」と思い、質問をしないことがあった。そのため、自分の理解が正しいか確認しないまま仕事を進め、あとでやり直すこともあった。今は、質問する前にまず自分がどこまで分かっているかを整理し、「ここまでは分かりましたが、この部分が分かりません」と聞くようにしている。すると、相手にも質問の内容が伝わりやすくなり、短い時間で必要な説明を受けられるようになった。質問しないことより、質問の仕方を工夫することのほうが大切だと感じている。","options":["分からないことがなかったから","何度も聞くと相手の迷惑になると思ったから","質問の日本語を知らなかったから","自分で全部調べる決まりだったから"],"answer":2,"explanation":{"jp":"「何度も聞くと迷惑かもしれない」と考えていました。","id":"Karena ia berpikir bertanya berkali-kali mungkin mengganggu orang lain.","point":"理由。"}},{"q":6,"section":"reading","instruction":"問題6　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"現在、筆者はどのように質問していますか。","stem_html":"現在、筆者はどのように質問していますか。","context":"新しい仕事を覚えるとき、私は以前、分からないことがあっても「何度も聞くと迷惑かもしれない」と思い、質問をしないことがあった。そのため、自分の理解が正しいか確認しないまま仕事を進め、あとでやり直すこともあった。今は、質問する前にまず自分がどこまで分かっているかを整理し、「ここまでは分かりましたが、この部分が分かりません」と聞くようにしている。すると、相手にも質問の内容が伝わりやすくなり、短い時間で必要な説明を受けられるようになった。質問しないことより、質問の仕方を工夫することのほうが大切だと感じている。","options":["分からないことを全部まとめて聞く","何も考えずすぐに聞く","分かっている部分と分からない部分を整理して聞く","質問せず、あとで仕事をやり直す"],"answer":3,"explanation":{"jp":"自分が分かっているところを整理してから、分からない部分を具体的に聞いています。","id":"Sekarang ia mengatur bagian yang sudah dipahami dan yang belum dipahami, lalu bertanya secara spesifik.","point":"方法。"}},{"q":7,"section":"reading","instruction":"問題6　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が一番伝えたいことは何ですか。","stem_html":"筆者が一番伝えたいことは何ですか。","context":"新しい仕事を覚えるとき、私は以前、分からないことがあっても「何度も聞くと迷惑かもしれない」と思い、質問をしないことがあった。そのため、自分の理解が正しいか確認しないまま仕事を進め、あとでやり直すこともあった。今は、質問する前にまず自分がどこまで分かっているかを整理し、「ここまでは分かりましたが、この部分が分かりません」と聞くようにしている。すると、相手にも質問の内容が伝わりやすくなり、短い時間で必要な説明を受けられるようになった。質問しないことより、質問の仕方を工夫することのほうが大切だと感じている。","options":["質問はできるだけしないほうがよい","分からない仕事は断るべきだ","質問する回数より、質問の仕方を工夫することが大切だ","同じ質問は何度してもよい"],"answer":3,"explanation":{"jp":"最後の文が筆者の結論です。質問しないことではなく、質問の仕方を工夫することが大切だと述べています。","id":"Kesimpulannya: bukan menghindari bertanya, tetapi memperbaiki cara bertanya yang penting.","point":"主張。"}},{"q":8,"section":"reading","instruction":"問題7　下のお知らせを読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"N3を受ける予定で、土曜日の午前に勉強できる人に最も合うクラスはどれですか。","stem_html":"N3を受ける予定で、土曜日の午前に勉強できる人に最も合うクラスはどれですか。","context":"【市民センター　秋の日本語講座】\nA 会話クラス：火曜日 18:30～20:00／初級～中級／全8回／3,000円\nB 読解クラス：木曜日 19:00～20:30／N3程度／全8回／3,000円\nC 試験対策クラス：土曜日 10:00～12:00／N3受験予定者／全6回／4,000円\nD 発音クラス：日曜日 14:00～15:00／レベル不問／全6回／2,000円\n※申込みは9月8日まで。定員を超えた場合は抽選。\n※仕事などで欠席した回の返金はありません。\n※BとCは同時に申し込めますが、割引はありません。","options":["A","B","C","D"],"answer":3,"explanation":{"jp":"土曜午前・N3受験予定者という条件に合うのはCです。","id":"Kelas C paling sesuai: Sabtu pagi dan untuk peserta yang akan mengikuti N3.","point":"情報検索。"}},{"q":9,"section":"reading","instruction":"問題7　下のお知らせを読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"このお知らせの内容と合っているものはどれですか。","stem_html":"このお知らせの内容と合っているものはどれですか。","context":"【市民センター　秋の日本語講座】\nA 会話クラス：火曜日 18:30～20:00／初級～中級／全8回／3,000円\nB 読解クラス：木曜日 19:00～20:30／N3程度／全8回／3,000円\nC 試験対策クラス：土曜日 10:00～12:00／N3受験予定者／全6回／4,000円\nD 発音クラス：日曜日 14:00～15:00／レベル不問／全6回／2,000円\n※申込みは9月8日まで。定員を超えた場合は抽選。\n※仕事などで欠席した回の返金はありません。\n※BとCは同時に申し込めますが、割引はありません。","options":["BとCを両方申し込むと料金が安くなる","欠席した回は返金される","申込者が多い場合は抽選になる","DはN3の人だけが参加できる"],"answer":3,"explanation":{"jp":"「定員を超えた場合は抽選」とあります。","id":"Jika pendaftar melebihi kapasitas, peserta dipilih melalui undian.","point":"条件。"}},{"q":10,"section":"reading","instruction":"問題7　下のお知らせを読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"BとCの両方に申し込む場合、合計いくら必要ですか。","stem_html":"BとCの両方に申し込む場合、合計いくら必要ですか。","context":"【市民センター　秋の日本語講座】\nA 会話クラス：火曜日 18:30～20:00／初級～中級／全8回／3,000円\nB 読解クラス：木曜日 19:00～20:30／N3程度／全8回／3,000円\nC 試験対策クラス：土曜日 10:00～12:00／N3受験予定者／全6回／4,000円\nD 発音クラス：日曜日 14:00～15:00／レベル不問／全6回／2,000円\n※申込みは9月8日まで。定員を超えた場合は抽選。\n※仕事などで欠席した回の返金はありません。\n※BとCは同時に申し込めますが、割引はありません。","options":["3,000円","4,000円","6,000円","7,000円"],"answer":4,"explanation":{"jp":"Bは3,000円、Cは4,000円で割引なしなので合計7,000円です。","id":"B biaya 3.000 yen dan C 4.000 yen, tanpa diskon, total 7.000 yen.","point":"複数情報統合。"}}],"iso":"2026-09-01","date_label":"9月1日"},{"day":6,"date":"9月2日","theme":"言語知識（文字・語彙）","target":20,"questions":[{"q":1,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"会社では、残業を減らすために仕事の進め方を（　　　）ことになりました。","stem_html":"会社では、残業を減らすために仕事の進め方を（　　　）ことになりました。","context":"","options":["見直す","受け取る","断る","取り消す"],"answer":1,"explanation":{"jp":"「見直す」は、もう一度調べて、必要なら改善することです。","id":"「見直す」berarti meninjau kembali dan memperbaiki bila perlu.","point":"文脈規定。"}},{"q":2,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"説明の時間が短いので、細かい例は（　　　）ことにします。","stem_html":"説明の時間が短いので、細かい例は（　　　）ことにします。","context":"","options":["引き受ける","省く","確かめる","取り組む"],"answer":2,"explanation":{"jp":"「省く」は、必要でない部分を取り除くことです。","id":"「省く」berarti menghilangkan bagian yang tidak diperlukan.","point":"文脈。"}},{"q":3,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"難しい問題ですが、チーム全員で（　　　）つもりです。","stem_html":"難しい問題ですが、チーム全員で（　　　）つもりです。","context":"","options":["受け取る","取り消す","取り組む","断る"],"answer":3,"explanation":{"jp":"「問題に取り組む」は、問題の解決のために努力することです。","id":"「問題に取り組む」berarti berusaha serius untuk menyelesaikan masalah.","point":"コロケーション。"}},{"q":4,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"予定が重なっているので、今回の依頼は（　　　）ことにしました。","stem_html":"予定が重なっているので、今回の依頼は（　　　）ことにしました。","context":"","options":["断る","まとめる","受け取る","確かめる"],"answer":1,"explanation":{"jp":"「依頼を断る」は、頼まれたことをできないと伝えることです。","id":"「依頼を断る」berarti menolak permintaan.","point":"コロケーション。"}},{"q":5,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"出発する前に、集合時間をもう一度（　　　）ください。","stem_html":"出発する前に、集合時間をもう一度（　　　）ください。","context":"","options":["省いて","取り消して","確かめて","引き受けて"],"answer":3,"explanation":{"jp":"「確かめる」は、間違いがないか確認することです。","id":"「確かめる」berarti memastikan atau memeriksa.","point":"文脈。"}},{"q":6,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"申し込んだ研修に行けなくなったので、参加を（　　　）。","stem_html":"申し込んだ研修に行けなくなったので、参加を（　　　）。","context":"","options":["まとめました","取り消しました","取り組みました","受け取りました"],"answer":2,"explanation":{"jp":"申込みをやめるので「取り消す」が合います。","id":"Karena tidak jadi mengikuti pelatihan, pendaftarannya dibatalkan.","point":"文脈。"}},{"q":7,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"会議で出た意見を三つに（　　　）、次回の課題を決めました。","stem_html":"会議で出た意見を三つに（　　　）、次回の課題を決めました。","context":"","options":["まとめて","断って","省いて","間に合って"],"answer":1,"explanation":{"jp":"複数の意見を整理するので「まとめる」です。","id":"Karena beberapa pendapat diatur menjadi tiga kelompok, 「まとめる」 tepat.","point":"文脈。"}},{"q":8,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"急な仕事を頼まれましたが、今日は予定があるので（　　　）。","stem_html":"急な仕事を頼まれましたが、今日は予定があるので（　　　）。","context":"","options":["引き受けました","断りました","受け取りました","確かめました"],"answer":2,"explanation":{"jp":"予定がありできないので、依頼を「断る」が自然です。","id":"Karena sudah ada rencana dan tidak bisa menerima pekerjaan, 「断る」 tepat.","point":"文脈。"}},{"q":9,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"新しいシステムを入れる前に、今の仕事の流れを一度（　　　）必要があります。","stem_html":"新しいシステムを入れる前に、今の仕事の流れを一度（　　　）必要があります。","context":"","options":["見直す","受け取る","取り消す","間に合う"],"answer":1,"explanation":{"jp":"導入前に現在の流れを再検討するので「見直す」です。","id":"Sebelum memasang sistem baru, alur kerja sekarang perlu ditinjau kembali.","point":"文脈。"}},{"q":10,"section":"vocab","instruction":"問題3　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"締切が今日の5時なので、急げばまだ（　　　）と思います。","stem_html":"締切が今日の5時なので、急げばまだ（　　　）と思います。","context":"","options":["取り組む","間に合う","省く","断る"],"answer":2,"explanation":{"jp":"締切までに終えられそうなので「間に合う」です。","id":"Karena masih mungkin selesai sebelum pukul 5, 「間に合う」 tepat.","point":"文脈。"}},{"q":11,"section":"vocab","instruction":"問題4　　　　　のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","stem":"電車が少し遅れましたが、会議には間に合いました。","stem_html":"電車が少し遅れましたが、会議には<u>間に合いました</u>。","context":"","options":["会議が始まる前に着きました","会議に出ませんでした","会議を延期しました","会議の時間を間違えました"],"answer":1,"explanation":{"jp":"「間に合う」は、決められた時間までに着く・終わることです。","id":"「間に合う」berarti tiba atau selesai sebelum batas waktu.","point":"言い換え。"}},{"q":12,"section":"vocab","instruction":"問題4　　　　　のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","stem":"受付で資料を受け取りました。","stem_html":"受付で資料を<u>受け取りました</u>。","context":"","options":["資料を渡しました","資料をもらいました","資料をなくしました","資料を作りました"],"answer":2,"explanation":{"jp":"「受け取る」は、人から物などをもらうことです。","id":"「受け取る」berarti menerima sesuatu dari orang lain.","point":"言い換え。"}},{"q":13,"section":"vocab","instruction":"問題4　　　　　のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","stem":"忙しかったのですが、その仕事を引き受けました。","stem_html":"忙しかったのですが、その仕事を<u>引き受けました</u>。","context":"","options":["その仕事をすることを受け入れました","その仕事を途中でやめました","その仕事をほかの人に頼みました","その仕事を忘れました"],"answer":1,"explanation":{"jp":"「引き受ける」は、仕事や責任を自分がすることを受け入れる意味です。","id":"「引き受ける」berarti menerima pekerjaan atau tanggung jawab untuk dikerjakan sendiri.","point":"言い換え。"}},{"q":14,"section":"vocab","instruction":"問題4　　　　　のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","stem":"話し合った内容をまとめてください。","stem_html":"話し合った内容を<u>まとめて</u>ください。","context":"","options":["一つに整理してください","もっと長くしてください","全部取り消してください","誰にも知らせないでください"],"answer":1,"explanation":{"jp":"「まとめる」は、ばらばらの内容を整理して一つにすることです。","id":"「まとめる」berarti mengatur berbagai isi menjadi satu rangkuman.","point":"言い換え。"}},{"q":15,"section":"vocab","instruction":"問題4　　　　　のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","stem":"予約を取り消しました。","stem_html":"予約を<u>取り消しました</u>。","context":"","options":["予約を変更しました","予約を確認しました","予約をキャンセルしました","予約を増やしました"],"answer":3,"explanation":{"jp":"「取り消す」は、決めたことや申し込みなどをなかったことにする意味です。","id":"「取り消す」berarti membatalkan sesuatu yang sudah ditetapkan atau didaftarkan.","point":"言い換え。"}},{"q":16,"section":"vocab","instruction":"問題5　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"取り組む","stem_html":"取り組む","context":"","options":["職員全員で業務改善に取り組んでいる","駅まで取り組んで歩いた","荷物を取り組んで机に置いた","先生に取り組んで電話した"],"answer":1,"explanation":{"jp":"「課題・問題・仕事に取り組む」のように使います。","id":"Digunakan seperti 「課題に取り組む」「問題に取り組む」 untuk menghadapi tugas/masalah secara serius.","point":"用法。"}},{"q":17,"section":"vocab","instruction":"問題5　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"見直す","stem_html":"見直す","context":"","options":["ミスが続いたので、作業手順を見直した","友だちを駅で見直した","ご飯を見直して食べた","電話を見直して話した"],"answer":1,"explanation":{"jp":"計画・制度・方法・手順などを再検討するとき「見直す」を使います。","id":"「見直す」digunakan untuk meninjau kembali rencana, sistem, metode, prosedur, dan sebagainya.","point":"用法。"}},{"q":18,"section":"vocab","instruction":"問題5　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"省く","stem_html":"省く","context":"","options":["時間がないので、説明の一部を省いた","朝ご飯を省いて駅に着いた","友だちを省いて電話した","天気を省いて判断した"],"answer":1,"explanation":{"jp":"不要な部分・手順・説明などを取り除く意味です。","id":"「省く」berarti menghilangkan bagian, langkah, atau penjelasan yang tidak diperlukan.","point":"用法。"}},{"q":19,"section":"vocab","instruction":"問題5　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"引き受ける","stem_html":"引き受ける","context":"","options":["忙しいが、新人の指導を引き受けた","電車を引き受けて会社へ行った","雨を引き受けて傘をさした","資料を引き受けて読んだ"],"answer":1,"explanation":{"jp":"「仕事・役割・依頼を引き受ける」と使います。","id":"Digunakan seperti menerima pekerjaan, peran, atau permintaan.","point":"用法。"}},{"q":20,"section":"vocab","instruction":"問題5　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"確かめる","stem_html":"確かめる","context":"","options":["予約時間をメールでもう一度確かめた","会議室を確かめて座った","昼ご飯を確かめて食べた","先生に確かめて挨拶した"],"answer":1,"explanation":{"jp":"情報が正しいかどうか確認するときに使います。","id":"Digunakan untuk memastikan apakah informasi benar.","point":"用法。"}}],"iso":"2026-09-02","date_label":"9月2日"},{"day":7,"date":"9月3日","theme":"言語知識（文法）・読解","target":25,"questions":[{"q":1,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"電車が事故で止まっていました。（　　　）、別の路線を使って会社へ行きました。","stem_html":"電車が事故で止まっていました。（　　　）、別の路線を使って会社へ行きました。","context":"","options":["そこで","ただし","つまり","なお"],"answer":1,"explanation":{"jp":"問題が起き、その対応として次の行動をしたので「そこで」です。","id":"Karena terjadi masalah lalu diambil tindakan sebagai respons, 「そこで」 tepat.","point":"接続。"}},{"q":2,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この図書館は誰でも利用できます。（　　　）、本を借りるには利用カードが必要です。","stem_html":"この図書館は誰でも利用できます。（　　　）、本を借りるには利用カードが必要です。","context":"","options":["そのため","ただし","ところが","つまり"],"answer":2,"explanation":{"jp":"前の内容に条件・注意を加えるので「ただし」です。","id":"Menambahkan syarat atau catatan pada pernyataan sebelumnya, sehingga 「ただし」 tepat.","point":"条件。"}},{"q":3,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"天気予報では晴れると言っていました。（　　　）、午後から大雨になりました。","stem_html":"天気予報では晴れると言っていました。（　　　）、午後から大雨になりました。","context":"","options":["そこで","なお","ところが","つまり"],"answer":3,"explanation":{"jp":"予想と実際が反対なので「ところが」です。","id":"Karena hasil nyata bertentangan dengan perkiraan, 「ところが」 tepat.","point":"予想外。"}},{"q":4,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"工事のため、この道は通れません。（　　　）、駅へ行く人は反対側の道を使ってください。","stem_html":"工事のため、この道は通れません。（　　　）、駅へ行く人は反対側の道を使ってください。","context":"","options":["そのため","一方で","つまり","なお"],"answer":1,"explanation":{"jp":"通れないことが理由で別の道を使うので「そのため」です。","id":"Karena jalan tidak dapat dilewati, akibatnya harus menggunakan jalan lain.","point":"因果。"}},{"q":5,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この仕事は大変です。（　　　）、自分で考えて工夫できる面白さもあります。","stem_html":"この仕事は大変です。（　　　）、自分で考えて工夫できる面白さもあります。","context":"","options":["つまり","一方で","そのため","そこで"],"answer":2,"explanation":{"jp":"大変な面と面白い面という二つの側面を対比するので「一方で」です。","id":"Menunjukkan dua sisi yang berbeda: sulit tetapi juga menarik, jadi 「一方で」 tepat.","point":"対比。"}},{"q":6,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この試験は辞書を使えません。（　　　）、分からない言葉があっても自分で考える必要があります。","stem_html":"この試験は辞書を使えません。（　　　）、分からない言葉があっても自分で考える必要があります。","context":"","options":["つまり","ただし","なお","ところが"],"answer":1,"explanation":{"jp":"前の内容を分かりやすく言い換えた結論なので「つまり」です。","id":"Bagian kedua menjelaskan kembali makna bagian pertama, jadi 「つまり」 tepat.","point":"言い換え。"}},{"q":7,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"何度練習しても、まだうまくできません。（　　　）、もう少し続けてみるつもりです。","stem_html":"何度練習しても、まだうまくできません。（　　　）、もう少し続けてみるつもりです。","context":"","options":["そのため","それでも","つまり","そこで"],"answer":2,"explanation":{"jp":"うまくできないという悪い条件があっても続けるので「それでも」です。","id":"Walaupun belum bisa dengan baik, tetap akan melanjutkan, jadi 「それでも」 tepat.","point":"逆条件。"}},{"q":8,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"申込期限は9月8日です。（　　　）、定員になり次第、受付を終了する場合があります。","stem_html":"申込期限は9月8日です。（　　　）、定員になり次第、受付を終了する場合があります。","context":"","options":["なお","ところが","つまり","そこで"],"answer":1,"explanation":{"jp":"追加の注意情報を付けるので「なお」です。","id":"Menambahkan informasi/catatan tambahan, sehingga 「なお」 tepat.","point":"追加情報。"}},{"q":9,"section":"grammar","instruction":"問題3　つぎの文章を読んで、文章全体の内容を考えて、（9）から（12）に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"私は通勤時間を利用して単語を復習しています。（9）、電車が混んでいる日は本を開けないので、スマートフォンの音声を聞きます。","stem_html":"私は通勤時間を利用して単語を復習しています。（9）、電車が混んでいる日は本を開けないので、スマートフォンの音声を聞きます。","context":"","options":["ただし","つまり","そこで","そのため"],"answer":1,"explanation":{"jp":"普段の方法に対する例外・条件を示しているので「ただし」です。","id":"Menunjukkan pengecualian terhadap cara biasa, jadi 「ただし」 tepat.","point":"文章の流れ。"}},{"q":10,"section":"grammar","instruction":"問題3　つぎの文章を読んで、文章全体の内容を考えて、（9）から（12）に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この店は駅から少し遠い。（10）、値段が安くて品物の種類が多いので、休日には多くの人が来る。","stem_html":"この店は駅から少し遠い。（10）、値段が安くて品物の種類が多いので、休日には多くの人が来る。","context":"","options":["そのため","ところが","一方で","なお"],"answer":3,"explanation":{"jp":"遠いという不利な点と、安く種類が多いという利点を対比しているので「一方で」です。","id":"Membandingkan kekurangan dan kelebihan, sehingga 「一方で」 tepat.","point":"対比。"}},{"q":11,"section":"grammar","instruction":"問題3　つぎの文章を読んで、文章全体の内容を考えて、（9）から（12）に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"会議では多くの意見が出ました。（11）、来月から試験的に新しい方法を始めることになりました。","stem_html":"会議では多くの意見が出ました。（11）、来月から試験的に新しい方法を始めることになりました。","context":"","options":["つまり","その結果","ただし","なお"],"answer":2,"explanation":{"jp":"話し合いの結果として決定が生まれたので「その結果」です。","id":"Keputusan muncul sebagai hasil rapat, jadi 「その結果」 tepat.","point":"結果。"}},{"q":12,"section":"grammar","instruction":"問題3　つぎの文章を読んで、文章全体の内容を考えて、（9）から（12）に入る最もよいものを、1・2・3・4から一つえらびなさい。","stem":"新しい機械を入れれば、作業は一部速くなります。（12）、機械を入れるだけで全ての問題が解決するわけではありません。","stem_html":"新しい機械を入れれば、作業は一部速くなります。（12）、機械を入れるだけで全ての問題が解決するわけではありません。","context":"","options":["例えば","したがって","しかし","つまり"],"answer":3,"explanation":{"jp":"前文の肯定的内容に対して制限を示すので「しかし」です。","id":"Menunjukkan batasan yang berlawanan dengan pernyataan positif sebelumnya, jadi 「しかし」 tepat.","point":"逆接。"}},{"q":13,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が「失敗」とだけ考えないほうがよいと言っているのはなぜですか。","stem_html":"筆者が「失敗」とだけ考えないほうがよいと言っているのはなぜですか。","context":"新しい制度を始めるとき、最初から完璧な方法を作るのは難しい。実際に使ってみると、考えていなかった問題が見つかることもある。大切なのは、問題が出たことを「失敗」とだけ考えないことだ。どこで困ったのかを記録し、原因を考え、方法を少しずつ直していけばよい。制度を変えることより、使いながら見直し続けることのほうが重要な場合もある。","options":["問題は必ず自然に消えるから","問題から改善するための情報を得られるから","最初から完璧な制度を作れるから","記録をしなくても原因が分かるから"],"answer":2,"explanation":{"jp":"問題が出た場所を記録し、原因を考えることで方法を直せるからです。","id":"Masalah dapat menjadi informasi untuk perbaikan jika dicatat dan dianalisis penyebabnya.","point":"主張の理由。"}},{"q":14,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が最も重要だと考えていることは何ですか。","stem_html":"筆者が最も重要だと考えていることは何ですか。","context":"新しい制度を始めるとき、最初から完璧な方法を作るのは難しい。実際に使ってみると、考えていなかった問題が見つかることもある。大切なのは、問題が出たことを「失敗」とだけ考えないことだ。どこで困ったのかを記録し、原因を考え、方法を少しずつ直していけばよい。制度を変えることより、使いながら見直し続けることのほうが重要な場合もある。","options":["制度を何度も全部作り直すこと","問題が出ない方法を最初に作ること","実際に使いながら継続して見直すこと","問題があっても記録しないこと"],"answer":3,"explanation":{"jp":"最後の文で、使いながら見直し続けることが重要だと述べています。","id":"Penulis menekankan pentingnya terus meninjau dan memperbaiki sambil menggunakan sistem.","point":"主旨。"}},{"q":15,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"この文章の内容と合っているものはどれですか。","stem_html":"この文章の内容と合っているものはどれですか。","context":"新しい制度を始めるとき、最初から完璧な方法を作るのは難しい。実際に使ってみると、考えていなかった問題が見つかることもある。大切なのは、問題が出たことを「失敗」とだけ考えないことだ。どこで困ったのかを記録し、原因を考え、方法を少しずつ直していけばよい。制度を変えることより、使いながら見直し続けることのほうが重要な場合もある。","options":["新しい制度では問題が出たらすぐ中止すべきだ","実際に使うと予想外の問題が見つかることがある","制度は一度決めたら変えないほうがよい","問題の原因を考える必要はない"],"answer":2,"explanation":{"jp":"本文に「実際に使ってみると、考えていなかった問題が見つかることもある」とあります。","id":"Teks menyatakan bahwa saat benar-benar digunakan, masalah yang tidak diperkirakan dapat ditemukan.","point":"内容一致。"}},{"q":16,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"「少しずつ直していけばよい」とありますが、何を直しますか。","stem_html":"「少しずつ直していけばよい」とありますが、何を直しますか。","context":"新しい制度を始めるとき、最初から完璧な方法を作るのは難しい。実際に使ってみると、考えていなかった問題が見つかることもある。大切なのは、問題が出たことを「失敗」とだけ考えないことだ。どこで困ったのかを記録し、原因を考え、方法を少しずつ直していけばよい。制度を変えることより、使いながら見直し続けることのほうが重要な場合もある。","options":["問題の記録","制度を使う人","問題の原因","制度や仕事の方法"],"answer":4,"explanation":{"jp":"問題の原因を考えたあと、「方法を少しずつ直す」とあります。","id":"Yang diperbaiki sedikit demi sedikit adalah metode atau cara kerja/sistem.","point":"指示内容。"}},{"q":17,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が以前困っていたことは何ですか。","stem_html":"筆者が以前困っていたことは何ですか。","context":"私は以前、読解問題では文章を最初から最後まで同じ速さで読んでいた。そのため、長い文章では時間が足りなくなることが多かった。今は、まず質問を読み、何を探す必要があるか確認してから本文を読む。ただし、質問の言葉だけを探して答えを決めると、前後の意味を間違えることがある。必要な部分を見つけたら、その前後も読んで答えの根拠を確認するようにしている。","options":["質問を読む時間がなかった","長文を読むと時間が足りなくなった","本文の漢字が全く読めなかった","問題の選択肢が少なかった"],"answer":2,"explanation":{"jp":"全文を同じ速さで読み、長文で時間不足になることが多かったとあります。","id":"Dulu penulis sering kekurangan waktu saat membaca teks panjang.","point":"問題点。"}},{"q":18,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"現在、筆者が本文を読む前にしていることは何ですか。","stem_html":"現在、筆者が本文を読む前にしていることは何ですか。","context":"私は以前、読解問題では文章を最初から最後まで同じ速さで読んでいた。そのため、長い文章では時間が足りなくなることが多かった。今は、まず質問を読み、何を探す必要があるか確認してから本文を読む。ただし、質問の言葉だけを探して答えを決めると、前後の意味を間違えることがある。必要な部分を見つけたら、その前後も読んで答えの根拠を確認するようにしている。","options":["答えを先に決める","辞書で単語を調べる","質問を読み、探す情報を確認する","本文を全部音読する"],"answer":3,"explanation":{"jp":"まず質問を読み、「何を探す必要があるか」を確認します。","id":"Sekarang penulis membaca pertanyaan terlebih dahulu dan memastikan informasi yang harus dicari.","point":"手順。"}},{"q":19,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が注意していることは何ですか。","stem_html":"筆者が注意していることは何ですか。","context":"私は以前、読解問題では文章を最初から最後まで同じ速さで読んでいた。そのため、長い文章では時間が足りなくなることが多かった。今は、まず質問を読み、何を探す必要があるか確認してから本文を読む。ただし、質問の言葉だけを探して答えを決めると、前後の意味を間違えることがある。必要な部分を見つけたら、その前後も読んで答えの根拠を確認するようにしている。","options":["質問にある言葉だけを見て答えを決めないこと","本文はできるだけ速く一度だけ読むこと","分からないところは全部飛ばすこと","質問は本文を読んだ後に初めて見ること"],"answer":1,"explanation":{"jp":"質問と同じ言葉だけを探して答えると、前後の意味を間違える可能性があると述べています。","id":"Penulis berhati-hati agar tidak memilih jawaban hanya karena menemukan kata yang sama dengan pertanyaan.","point":"注意点。"}},{"q":20,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"この文章で筆者がすすめている読み方に最も近いものはどれですか。","stem_html":"この文章で筆者がすすめている読み方に最も近いものはどれですか。","context":"私は以前、読解問題では文章を最初から最後まで同じ速さで読んでいた。そのため、長い文章では時間が足りなくなることが多かった。今は、まず質問を読み、何を探す必要があるか確認してから本文を読む。ただし、質問の言葉だけを探して答えを決めると、前後の意味を間違えることがある。必要な部分を見つけたら、その前後も読んで答えの根拠を確認するようにしている。","options":["最初から最後まで同じ速さで読む","質問を先に確認し、必要部分の前後まで読んで根拠を確かめる","質問の言葉と同じ言葉だけを探す","全ての単語の意味を調べてから答える"],"answer":2,"explanation":{"jp":"質問で目的を確認し、必要部分を見つけたら前後も読んで根拠を確かめる方法です。","id":"Metode yang dianjurkan: baca pertanyaan dulu, cari bagian yang perlu, lalu baca konteks sekitarnya untuk memastikan bukti.","point":"学習方略。"}}],"iso":"2026-09-03","date_label":"9月3日"},{"day":8,"date":"9月4日","theme":"第1週小テスト","target":30,"questions":[{"q":1,"section":"vocab","instruction":"問題1　　　　　のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"来月から勤務時間が変更されます。","stem_html":"来月から勤務時間が<u>変更</u>されます。","context":"","options":["へんごう","へんこう","へっんこう","べんこう"],"answer":2,"explanation":{"jp":"変更＝へんこう。決まっていた内容を変えること","id":"変更 dibaca へんこう. perubahan","point":""}},{"q":2,"section":"vocab","instruction":"問題1　　　　　のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"研修は予定どおり実施します。","stem_html":"研修は予定どおり<u>実施</u>します。","context":"","options":["じっん","じっじ","じっし","じし"],"answer":3,"explanation":{"jp":"実施＝じっし。計画していたことを実際に行うこと","id":"実施 dibaca じっし. pelaksanaan","point":""}},{"q":3,"section":"vocab","instruction":"問題1　　　　　のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この施設の設備は担当者が管理しています。","stem_html":"この施設の設備は担当者が<u>管理</u>しています。","context":"","options":["かり","かんり","かっんり","がんり"],"answer":2,"explanation":{"jp":"管理＝かんり。よい状態になるように整えること","id":"管理 dibaca かんり. pengelolaan","point":""}},{"q":4,"section":"vocab","instruction":"問題1　　　　　のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"時間を正確に記録してください。","stem_html":"時間を<u>正確</u>に記録してください。","context":"","options":["せいがく","ぜいかく","せいかぐ","せいかく"],"answer":4,"explanation":{"jp":"正確＝せいかく。間違いがなく正しいこと","id":"正確 dibaca せいかく. akurat","point":""}},{"q":5,"section":"vocab","instruction":"問題1　　　　　のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"遅れる場合は、必ず担当者に連絡してください。","stem_html":"遅れる場合は、必ず担当者に<u>連絡</u>してください。","context":"","options":["れんらく","れんらぐ","れらく","れっんらく"],"answer":1,"explanation":{"jp":"連絡＝れんらく。情報を相手に知らせること","id":"連絡 dibaca れんらく. menghubungi","point":""}},{"q":6,"section":"vocab","instruction":"問題2　　　　　のことばを漢字で書くとき、最もよいものを、1・2・3・4から一つえらびなさい。","stem":"雨の状況を見て、行事を行うかはんだんします。","stem_html":"雨の状況を見て、行事を行うか<u>はんだん</u>します。","context":"","options":["判段","断判","判断","半断"],"answer":3,"explanation":{"jp":"「はんだん」は「判断」と書く。","id":"はんだん ditulis 判断.","point":""}},{"q":7,"section":"vocab","instruction":"問題2　　　　　のことばを漢字で書くとき、最もよいものを、1・2・3・4から一つえらびなさい。","stem":"ぐたいてきな例を使って説明してください。","stem_html":"<u>ぐたいてき</u>な例を使って説明してください。","context":"","options":["具用","具体的","具体約","的体具"],"answer":2,"explanation":{"jp":"「ぐたいてき」は「具体的」と書く。","id":"ぐたいてき ditulis 具体的.","point":""}},{"q":8,"section":"vocab","instruction":"問題2　　　　　のことばを漢字で書くとき、最もよいものを、1・2・3・4から一つえらびなさい。","stem":"話し合ったけっか、予定を変更することになりました。","stem_html":"話し合った<u>けっか</u>、予定を変更することになりました。","context":"","options":["結果","果結","結菓","括果"],"answer":1,"explanation":{"jp":"「けっか」は「結果」と書く。","id":"けっか ditulis 結果.","point":""}},{"q":9,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れる atas waktu pendaftaran。","point":""}},{"q":20,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"料理教室に参加できなくなった場合、どうすればよいか。","stem_html":"料理教室に参加できなくなった場合、どうすればよいか。","context":"料理教室のお知らせ\n料理教室を11月8日、午前10時から午後1時まで文化センター3階で行います。参加を希望する人は11月1日までに申し込んでください。材料費500円です。申し込み後に参加できなくなった場合は、前日までに担当者へ連絡してください。当日は開始10分前までに受付を済ませてください。","options":["前日までに担当者へ連絡する。","別の人を必ず探す。","何もしなくてよい。","当日会場で説明する。"],"answer":1,"explanation":{"jp":"キャンセル時の条件を問う。","id":"Jika tidak bisa ikut, hubungi penanggung jawab paling lambat sehari sebelumnya。","point":""}},{"q":21,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"メモをするようになって、どうなったか。","stem_html":"メモをするようになって、どうなったか。","context":"買い物のメモ\n私は買い物に行く前、必要な物をスマートフォンにメモする。以前は頭の中で覚えているつもりだったが、店に着くと一つ二つ忘れることがよくあった。メモするようになってから忘れ物は減ったが、別の商品を見て予定にない物を買うことはまだある。メモは便利だが、それだけで無駄な買い物がなくなるわけではないようだ。","options":["スマートフォンを使わなくなった。","買い物に行かなくなった。","必要な物を忘れることが減った。","予定にない物を全く買わなくなった。"],"answer":3,"explanation":{"jp":"変化した点は「忘れ物が減った」。","id":"Perubahan: lebih jarang lupa barang yang dibutuhkan。","point":""}},{"q":22,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が言いたいことは何か。","stem_html":"筆者が言いたいことは何か。","context":"買い物のメモ\n私は買い物に行く前、必要な物をスマートフォンにメモする。以前は頭の中で覚えているつもりだったが、店に着くと一つ二つ忘れることがよくあった。メモするようになってから忘れ物は減ったが、別の商品を見て予定にない物を買うことはまだある。メモは便利だが、それだけで無駄な買い物がなくなるわけではないようだ。","options":["必要な物は頭だけで覚えるべきだ。","買い物ではスマートフォンを使わないほうがよい。","メモは役立つが、それだけで全ての問題が解決するわけではない。","メモをすれば無駄な買い物は完全になくなる。"],"answer":3,"explanation":{"jp":"最後の文が筆者の主張。","id":"Catatan membantu, tetapi tidak menyelesaikan semua masalah。","point":""}},{"q":23,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"定期利用を始めるために必要なものは何か。","stem_html":"定期利用を始めるために必要なものは何か。","context":"自転車置き場の利用\n駅前の市営自転車置き場は、午前5時から翌日の午前1時まで利用できる。料金は1日100円で、定期利用の場合は1か月1800円である。定期利用を始めるには、管理室で申込書を書き、身分証明書を見せる必要がある。月の途中から申し込んでも料金は同じで、日割りにはならない。","optio ":17,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"日曜日に働けない場合、佐藤さんは何をする必要があるか。","stem_html":"日曜日に働けない場合、佐藤さんは何をする必要があるか。","context":"アルバイトのシフト確認\n佐藤さんへ。来週のシフトについて確認です。火曜日は午後1時から6時まで、木曜日は午前10時から午後3時までお願いします。土曜日は予定表では出勤になっていますが、店の都合で休みになりました。その代わり、可能であれば日曜日の午後2時から7時までお願いしたいです。日曜日が難しい場合は、明日の正午までに返信してください。","options":["土曜日に出勤する。","明日の正午までに返信する。","火曜日を休む。","今日中に店へ行く。"],"answer":2,"explanation":{"jp":"返信期限を確認する。","id":"Jika Minggu tidak bisa, balas sebelum siang besok。","point":""}},{"q":18,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"土曜日のシフトはどうなったか。","stem_html":"土曜日のシフトはどうなったか。","context":"アルバイトのシフト確認\n佐藤さんへ。来週のシフトについて確認です。火曜日は午後1時から6時まで、木曜日は午前10時から午後3時までお願いします。土曜日は予定表では出勤になっていますが、店の都合で休みになりました。その代わり、可能であれば日曜日の午後2時から7時までお願いしたいです。日曜日が難しい場合は、明日の正午までに返信してください。","options":["日曜日と同じ時間になった。","開始時刻だけ変わった。","予定どおり出勤する。","休みになった。"],"answer":4,"explanation":{"jp":"土曜日は店の都合で休み。","id":"Hari Sabtu menjadi libur。","point":""}},{"q":19,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"予約した本について正しいものはどれか。","stem_html":"予約した本について正しいものはどれか。","context":"図書館の予約本\n市立図書館では、借りたい本が貸出中のとき、インターネットから予約することができる。予約した本が返却されると、登録したメールアドレスに連絡が届く。連絡を受けた日を含めて7日以内に本を受け取らなければ、予約は自動的に取り消される。ただし、休館日は7日に数えない。受け取り場所は予約時に本館か駅前分館を選ぶことができ、連絡後に変更することはできない。","options":["期限までに受け取らないと予約が取り消される。","受け取り場所は連絡後でも変更できる。","連絡が来てから7日以内なら、休館日も数える。","貸出中でない本だけ予約できる。"],"answer":1,"explanation":{"jp":"期限と取り消し条件を読む。","id":"Jika tidak diambil sampai batas waktu, reservasi dibatalkan。","point":""}},{"q":20,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"受け取り場所について、本文からわかることは何か。","stem_html":"受け取り場所について、本文からわかることは何か。","context":"図書館の予約本\n市立図書館では、借りたい本が貸出中のとき、インターネットから予約することができる。予約した本が返却されると、登録したメールアドレスに連絡が届く。連絡を受けた日を含めて7日以内に本を受け取らなければ、予約は自動的に取り消される。ただし、休館日は7日に数えない。受け取り場所は予約時に本館か駅前分館を選ぶことができ、連絡後に変更することはできない。","options":["予約するときに選ぶ。","本館だ aginya。","point":""}},{"q":8,"section":"reading","instruction":"問題7　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"「私」が以前困っていたことは何か。","stem_html":"「私」が以前困っていたことは何か。","context":"メモの取り方\n私は以前、授業中に先生が言ったことをできるだけ全部ノートに書こうとしていた。しかし、書くことに集中しすぎて、説明の意味をよく考えられないことがあった。そこで最近は、大切だと思った言葉だけを書き、授業が終わってから自分の言葉で内容をまとめるようにしている。この方法に変えてから、後でノートを見たときにも内容を思い出しやすくなった。もちろん、人によって合う方法は違うが、私には今の方法のほうが合っているようだ。","options":["授業が終わってからまとめる時間がなかったこと","大切な言葉が分からなかったこと","先生の声が聞こえなかったこと","ノートを書くことに集中し、内容を考えにくかったこと"],"answer":4,"explanation":{"jp":"以前の問題点を問う。","id":"Masalah sebelumnya: terlalu fokus menulis sehingga sulit memahami isi。","point":""}},{"q":9,"section":"reading","instruction":"問題8　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"土曜日のシフトはどうなったか。","stem_html":"土曜日のシフトはどうなったか。","context":"アルバイトのシフト確認\n佐藤さんへ。来週のシフトについて確認です。火曜日は午後1時から6時まで、木曜日は午前10時から午後3時までお願いします。土曜日は予定表では出勤になっていますが、店の都合で休みになりました。その代わり、可能であれば日曜日の午後2時から7時までお願いしたいです。日曜日が難しい場合は、明日の正午までに返信してください。","options":["予定どおり出勤する。","休みになった。","開始時刻だけ変わった。","日曜日と同じ時間になった。"],"answer":2,"explanation":{"jp":"土曜日は店の都合で休み。","id":"Hari Sabtu menjadi libur。","point":""}},{"q":10,"section":"reading","instruction":"問題8　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"日曜日に働けない場合、佐藤さんは何をする必要があるか。","stem_html":"日曜日に働けない場合、佐藤さんは何をする必要があるか。","context":"アルバイトのシフト確認\n佐藤さんへ。来週のシフトについて確認です。火曜日は午後1時から6時まで、木曜日は午前10時から午後3時までお願いします。土曜日は予定表では出勤になっていますが、店の都合で休みになりました。その代わり、可能であれば日曜日の午後2時から7時までお願いしたいです。日曜日が難しい場合は、明日の正午までに返信してください。","options":["明日の正午までに返信する。","土曜日に出勤する。","火曜日を休む。","今日中に店へ行く。"],"answer":1,"explanation":{"jp":"返信期限を確認する。","id":"Jika Minggu tidak bisa, balas sebelum siang besok。","point":""}}],"iso":"2026-09-29","date_label":"9月29日"},{"day":34,"date":"9月30日","theme":"類義語の使い分け","target":20,"questions":[{"q":1,"section":"vocab","instruction":"問題1　　　　　のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"みんなで協力して準備しました。","stem_html":"みんなで<u>協力</u>して準備しました。","context":"","options":["きっょうりょく","きょうりょく","きょうりょぐ","ぎょうりょく"],"answer":2,"exp 0人対象しました。","来週の会議は午後3時を対象にしています。","駅を対象に電車を降りました。"],"answer":1,"explanation":{"jp":"「～を対象にする」が自然で、「だれ・何に向けたものか」を表す。","id":"Pola alami: ～を対象にする, menunjukkan sasaran。","point":""}},{"q":15,"section":"vocab","instruction":"問題3　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"改善","stem_html":"改善","context":"","options":["雨が強いので、天気を改善してください。","会議の開始時刻を改善して午後2時にしました。","昨日より電車の到着が改善しました。","利用者の意見を参考に、サービスを改善しました。"],"answer":4,"explanation":{"jp":"「問題のある状態・方法・サービスなどをよくする」ときに使う。単なる時刻変更には普通使わない。","id":"改善 dipakai untuk memperbaiki kondisi/metode/layanan, bukan sekadar mengubah waktu。","point":""}},{"q":16,"section":"vocab","instruction":"問題3　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"延期","stem_html":"延期","context":"","options":["毎朝の朝食を30分延期して食べています。","台風のため、試合は来週に延期されました。","この資料の内容を延期して短くしました。","電車が5分延期して駅に着きました。"],"answer":2,"explanation":{"jp":"予定していた行事・実施日などを後に変えるときに使う。","id":"延期 digunakan untuk menunda acara/jadwal ke waktu berikutnya。","point":""}},{"q":17,"section":"vocab","instruction":"問題3　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"対応","stem_html":"対応","context":"","options":["会議の資料を10枚対応してください。","明日の天気に対応して雨が降ります。","急な問い合わせにも落ち着いて対応してください。","駅までの時間を対応して調べました。"],"answer":3,"explanation":{"jp":"「問い合わせ・問題・状況などに対応する」が自然。","id":"対応 digunakan untuk menangani pertanyaan, masalah, atau situasi。","point":""}},{"q":18,"section":"vocab","instruction":"問題3　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"共有","stem_html":"共有","context":"","options":["昨日の雨をみんなで共有しました。","会議で決まったことを全員で共有しました。","資料を担当者に共有して渡しました。","会議室を午後3時に共有しました。"],"answer":2,"explanation":{"jp":"情報・考え・物などを複数の人が共に持つ意味。特に情報共有でよく使う。","id":"共有 berarti berbagi informasi/hal yang sama dengan beberapa orang。","point":""}},{"q":19,"section":"vocab","instruction":"問題3　つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","stem":"工夫","stem_html":"工夫","context":"","options":["覚えやすいように、ノートの書き方を工夫しました。","会議の時間を工夫して3時に変更しました。","先生から工夫を一枚もらいました。","駅まで工夫して歩きました。"],"answer":1,"explanation":{"jp":"よりよくするために方法を考える＝工夫する。","id":"工夫 ber れた時間に健康診断を受けられない人は、どうすればよいか。","stem_html":"指定された時間に健康診断を受けられない人は、どうすればよいか。","context":"健康診断の時間について\n社員のみなさんへ。来週の健康診断は、午前9時から12時まで3階会議室で行います。部署ごとに受付時間が決まっていますが、仕事の都合で指定された時間に行けない場合は、前日の正午までに総務課へ連絡してください。当日は朝食を取らず、水だけ飲んで来てください。結果は約2週間後に個人へ渡します。","options":["2週間後に連絡する。","当日の朝に会議室で相談する。","健康診断を受けなくてよい。","前日の正午までに総務課へ連絡する。"],"answer":4,"explanation":{"jp":"変更連絡の期限を読み取る。","id":"Jika tidak bisa pada waktu yang ditentukan, hubungi bagian umum sebelum siang sehari sebelumnya。","point":""}},{"q":28,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"健康診断の日の朝について正しいものはどれか。","stem_html":"健康診断の日の朝について正しいものはどれか。","context":"健康診断の時間について\n社員のみなさんへ。来週の健康診断は、午前9時から12時まで3階会議室で行います。部署ごとに受付時間が決まっていますが、仕事の都合で指定された時間に行けない場合は、前日の正午までに総務課へ連絡してください。当日は朝食を取らず、水だけ飲んで来てください。結果は約2週間後に個人へ渡します。","options":["朝食も水も取ってはいけない。","朝食は取らず、水は飲んでもよい。","結果を受け取ってから朝食を取る。","いつもより多く朝食を取る。"],"answer":2,"explanation":{"jp":"朝食と水の条件を区別する。","id":"Tidak sarapan, tetapi boleh minum air。","point":""}},{"q":29,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"予約した本について正しいものはどれか。","stem_html":"予約した本について正しいものはどれか。","context":"図書館の予約本\n市立図書館では、借りたい本が貸出中のとき、インターネットから予約することができる。予約した本が返却されると、登録したメールアドレスに連絡が届く。連絡を受けた日を含めて7日以内に本を受け取らなければ、予約は自動的に取り消される。ただし、休館日は7日に数えない。受け取り場所は予約時に本館か駅前分館を選ぶことができ、連絡後に変更することはできない。","options":["受け取り場所は連絡後でも変更できる。","期限までに受け取らないと予約が取り消される。","貸出中でない本だけ予約できる。","連絡が来てから7日以内なら、休館日も数える。"],"answer":2,"explanation":{"jp":"期限と取り消し条件を読む。","id":"Jika tidak diambil sampai batas waktu, reservasi dibatalkan。","point":""}},{"q":30,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"受け取り場所について、本文からわかることは何か。","stem_html":"受け取り場所について、本文からわかることは何か。","context":"図書館の予約本\n市立図書館では、借りたい本が貸出中のとき、インターネットから予約することができる。予約した本が返却されると、登録したメールアドレスに連絡が届く。連絡を受けた日を含めて7日以内に本を受け取らなければ、予約は自動的に取り消される。ただし、休館日は7日に数えない。受け取り場所は予約時に本館か駅前分館を選ぶことができ、連絡後に変更することはできない。","options":["予約するときに選ぶ。","いつでも変更できる。","本が返却され ない物を買うことはまだある。メモは便利だが、それだけで無駄な買い物がなくなるわけではないようだ。","options":["スマートフォンを使わなくなった。","買い物に行かなくなった。","必要な物を忘れることが減った。","予定にない物を全く買わなくなった。"],"answer":3,"explanation":{"jp":"変化した点は「忘れ物が減った」。","id":"Perubahan: lebih jarang lupa barang yang dibutuhkan。","point":""}},{"q":19,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"センターの都合で教室が中止になった場合、参加費はどうなるか。","stem_html":"センターの都合で教室が中止になった場合、参加費はどうなるか。","context":"オンライン予約のキャンセル\nスポーツセンターの教室をオンラインで予約した場合、開始日の3日前まではウェブサイトから無料でキャンセルできる。2日前から前日までは電話でのみ受け付け、参加費の半額を支払う必要がある。当日のキャンセルや連絡なしの欠席では参加費の全額が必要になる。ただし、センター側の都合で中止になった場合は全額返金される。","options":["半額だけ返る。","次回だけ無料になる。","返らない。","全額返る。"],"answer":4,"explanation":{"jp":"例外条件を確認する。","id":"Jika dibatalkan oleh pusat, uang dikembalikan penuh。","point":""}},{"q":20,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"教室の2日前にキャンセルする場合、どうすればよいか。","stem_html":"教室の2日前にキャンセルする場合、どうすればよいか。","context":"オンライン予約のキャンセル\nスポーツセンターの教室をオンラインで予約した場合、開始日の3日前まではウェブサイトから無料でキャンセルできる。2日前から前日までは電話でのみ受け付け、参加費の半額を支払う必要がある。当日のキャンセルや連絡なしの欠席では参加費の全額が必要になる。ただし、センター側の都合で中止になった場合は全額返金される。","options":["電話で連絡し、参加費の半額を払う。","参加費の全額が返金される。","何も連絡せず欠席する。","ウェブサイトで無料キャンセルする。"],"answer":1,"explanation":{"jp":"2日前～前日の条件。","id":"Dua hari sebelumnya: telepon dan bayar setengah biaya。","point":""}},{"q":21,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"定期利用を始めるために必要なものは何か。","stem_html":"定期利用を始めるために必要なものは何か。","context":"自転車置き場の利用\n駅前の市営自転車置き場は、午前5時から翌日の午前1時まで利用できる。料金は1日100円で、定期利用の場合は1か月1800円である。定期利用を始めるには、管理室で申込書を書き、身分証明書を見せる必要がある。月の途中から申し込んでも料金は同じで、日割りにはならない。","options":["1日100円だけ","自転車の写真だけ","駅の切符","申込書と身分証明書"],"answer":4,"explanation":{"jp":"手続きに必要な二点を確認する。","id":"Diperlukan formulir dan identitas。","point":""}}],"iso":"2026-10-19","date_label":"10月19日"},{"day":54,"date":"10月20日","theme":"模試①文法復習","target":20,"questions":[{"q":1,"section":"vocab","instruction":"問題1　　　　　のことばの読み方として最もよいものを、1・2・3 方、旅行に行くときは電子書籍を使う。何冊持って行っても荷物が重くならないのが便利だからだ。どちらか一つが優れているというより、目的に合わせて使い分けるのがよいと思う。","options":["電子書籍は小説には使えない。","電子書籍のほうが必ず優れている。","目的によって紙と電子を使い分けるとよい。","いつでも紙の本だけを使うべきだ。"],"answer":3,"explanation":{"jp":"最後の文が主張。","id":"Gunakan keduanya sesuai tujuan。","point":""}},{"q":19,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"このお知らせからわかることは何か。","stem_html":"このお知らせからわかることは何か。","context":"研修時間変更のお知らせ\n来週火曜日に予定していた新人研修は、講師の都合により午後2時開始に変更します。終了時間は午後4時30分の予定です。会場はこれまでお知らせした第2会議室から第1会議室に変わりました。参加できない人は、月曜日の午後5時までに担当者へメールで連絡してください。なお、資料は当日の朝までに共有フォルダへ入れますので、各自で印刷して持ってきてください。","options":["研修の会場は第2会議室のままである。","参加できない場合は月曜日の午後5時までに連絡する。","研修は火曜日の午前に行われる。","資料は担当者が当日会場で配る。"],"answer":2,"explanation":{"jp":"期限と連絡方法の条件照合。","id":"Perlu mencocokkan batas waktu dan cara menghubungi。","point":""}},{"q":20,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"参加者は研修当日までに何をする必要があるか。","stem_html":"参加者は研修当日までに何をする必要があるか。","context":"研修時間変更のお知らせ\n来週火曜日に予定していた新人研修は、講師の都合により午後2時開始に変更します。終了時間は午後4時30分の予定です。会場はこれまでお知らせした第2会議室から第1会議室に変わりました。参加できない人は、月曜日の午後5時までに担当者へメールで連絡してください。なお、資料は当日の朝までに共有フォルダへ入れますので、各自で印刷して持ってきてください。","options":["資料を自分で印刷する。","第2会議室を予約する。","月曜日までに必ずメールを送る。","講師に電話する。"],"answer":1,"explanation":{"jp":"資料は共有フォルダから各自印刷。","id":"Peserta harus mencetak materi sendiri。","point":""}},{"q":21,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"防災講座に参加する人がしなければならないことは何か。","stem_html":"防災講座に参加する人がしなければならないことは何か。","context":"防災講座のお知らせ\n防災講座を9月26日、午後1時から午後3時まで地域センター1階で行います。参加を希望する人は9月20日までに申し込んでください。無料です。申し込み後に参加できなくなった場合は、前日までに担当者へ連絡してください。当日は開始10分前までに受付を済ませてください。","options":["9月20日までに申し込む。","開始時刻ちょうどに受付する。","前日に会場を変更する。","参加できなくても連絡しなくてよい。"],"answer":1,"explanation":{"jp":"申込期限を確認する。","id":"Periksa batas waktu pendaftaran。","point":""}},{"q":22,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"防災講座に参加できなくな options":["メモをすれば無駄な買い物は完全になくなる。","買い物ではスマートフォンを使わないほうがよい。","メモは役立つが、それだけで全ての問題が解決するわけではない。","必要な物は頭だけで覚えるべきだ。"],"answer":3,"explanation":{"jp":"最後の文が筆者の主張。","id":"Catatan membantu, tetapi tidak menyelesaikan semua masalah。","point":""}},{"q":18,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"メモをするようになって、どうなったか。","stem_html":"メモをするようになって、どうなったか。","context":"買い物のメモ\n私は買い物に行く前、必要な物をスマートフォンにメモする。以前は頭の中で覚えているつもりだったが、店に着くと一つ二つ忘れることがよくあった。メモするようになってから忘れ物は減ったが、別の商品を見て予定にない物を買うことはまだある。メモは便利だが、それだけで無駄な買い物がなくなるわけではないようだ。","options":["スマートフォンを使わなくなった。","必要な物を忘れることが減った。","予定にない物を全く買わなくなった。","買い物に行かなくなった。"],"answer":2,"explanation":{"jp":"変化した点は「忘れ物が減った」。","id":"Perubahan: lebih jarang lupa barang yang dibutuhkan。","point":""}},{"q":19,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が旅行で電子書籍を使う理由は何か。","stem_html":"筆者が旅行で電子書籍を使う理由は何か。","context":"紙の本と電子書籍\n私は小説は紙の本で読むことが多い。ページをめくりながら読んだほうが、どのあたりに何が書いてあったか思い出しやすいからだ。一方、旅行に行くときは電子書籍を使う。何冊持って行っても荷物が重くならないのが便利だからだ。どちらか一つが優れているというより、目的に合わせて使い分けるのがよいと思う。","options":["電子書籍のほうが必ず安いから","荷物が重くならないから","内容を覚えやすいから","紙の本が買えないから"],"answer":2,"explanation":{"jp":"旅行時の利点を問う。","id":"Keuntungannya saat bepergian: barang tidak menjadi berat。","point":""}},{"q":20,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者の考えに合うものはどれか。","stem_html":"筆者の考えに合うものはどれか。","context":"紙の本と電子書籍\n私は小説は紙の本で読むことが多い。ページをめくりながら読んだほうが、どのあたりに何が書いてあったか思い出しやすいからだ。一方、旅行に行くときは電子書籍を使う。何冊持って行っても荷物が重くならないのが便利だからだ。どちらか一つが優れているというより、目的に合わせて使い分けるのがよいと思う。","options":["電子書籍は小説には使えない。","いつでも紙の本だけを使うべきだ。","目的によって紙と電子を使い分けるとよい。","電子書籍のほうが必ず優れている。"],"answer":3,"explanation":{"jp":"最後の文が主張。","id":"Gunakan keduanya sesuai tujuan。","point":""}},{"q":21,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"「私」は今の方法についてどう考えているか。","stem_html":"「私」は今の方法についてどう考えているか。","context":"メモの取り方\n私は以前、授業中に先生が言ったことをできるだ euntungannya saat bepergian: barang tidak menjadi berat。","point":""}},{"q":5,"section":"reading","instruction":"問題6　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"「私」は今の方法についてどう考えているか。","stem_html":"「私」は今の方法についてどう考えているか。","context":"メモの取り方\n私は以前、授業中に先生が言ったことをできるだけ全部ノートに書こうとしていた。しかし、書くことに集中しすぎて、説明の意味をよく考えられないことがあった。そこで最近は、大切だと思った言葉だけを書き、授業が終わってから自分の言葉で内容をまとめるようにしている。この方法に変えてから、後でノートを見たときにも内容を思い出しやすくなった。もちろん、人によって合う方法は違うが、私には今の方法のほうが合っているようだ。","options":["授業中は何も書かないほうがよいと思っている。","以前の方法より自分には合っていると思っている。","もっと全部書く練習が必要だと思っている。","誰にでも一番よい方法だと思っている。"],"answer":2,"explanation":{"jp":"最後の一文が筆者の評価。","id":"Penulis menilai cara sekarang lebih cocok baginya。","point":""}},{"q":6,"section":"reading","instruction":"問題6　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"「私」が以前困っていたことは何か。","stem_html":"「私」が以前困っていたことは何か。","context":"メモの取り方\n私は以前、授業中に先生が言ったことをできるだけ全部ノートに書こうとしていた。しかし、書くことに集中しすぎて、説明の意味をよく考えられないことがあった。そこで最近は、大切だと思った言葉だけを書き、授業が終わってから自分の言葉で内容をまとめるようにしている。この方法に変えてから、後でノートを見たときにも内容を思い出しやすくなった。もちろん、人によって合う方法は違うが、私には今の方法のほうが合っているようだ。","options":["大切な言葉が分からなかったこと","授業が終わってからまとめる時間がなかったこと","先生の声が聞こえなかったこと","ノートを書くことに集中し、内容を考えにくかったこと"],"answer":4,"explanation":{"jp":"以前の問題点を問う。","id":"Masalah sebelumnya: terlalu fokus menulis sehingga sulit memahami isi。","point":""}},{"q":7,"section":"reading","instruction":"問題7　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"日曜日に働けない場合、佐藤さんは何をする必要があるか。","stem_html":"日曜日に働けない場合、佐藤さんは何をする必要があるか。","context":"アルバイトのシフト確認\n佐藤さんへ。来週のシフトについて確認です。火曜日は午後1時から6時まで、木曜日は午前10時から午後3時までお願いします。土曜日は予定表では出勤になっていますが、店の都合で休みになりました。その代わり、可能であれば日曜日の午後2時から7時までお願いしたいです。日曜日が難しい場合は、明日の正午までに返信してください。","options":["明日の正午までに返信する。","今日中に店へ行く。","火曜日を休む。","土曜日に出勤する。"],"answer":1,"explanation":{"jp":"返信期限を確認する。","id":"Jika Minggu tidak bisa, balas sebelum siang besok。","point":""}},{"q":8,"section":"reading","instruction":"問題7　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"土曜日のシフトはどうなったか。","stem_html":"土曜日のシフトはどうなったか。","context":"アルバイトのシフト確認\n佐藤さんへ。来週のシフトについて確認です。火曜日は午後1時から6時まで、木曜日は午前10時から午後3時までお願いします。土曜日は予定表では出勤になっていますが、店の都合で休みになりました。その代わり、可能であれば日曜日の午後2時から7時までお願いしたいです。日曜日が難しい場合は、明日の正午までに返信してください。","options":["休みになった。","日曜日と同じ時間になった。","予定どおり出勤する。","開始時刻だけ変わった。"],"answer":1,"explanation":{"jp":"土曜日は店の都合で休み。","id":"Hari Sabtu menjadi libur。","point":""}},{"q":9,"section":"reading","instruction":"問題8　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"午後5時に特別展へ行く一般の人はいくら払うか。","stem_html":"午後5時に特別展へ行く一般の人はいくら払うか。","context":"美術館からのお知らせ\n市立美術館では、10月1日から特別展を行います。一般料金は1200円ですが、午後4時以降に入館する場合は900円です。毎週月曜日は休館ですが、10月12日の月曜日は祝日のため開館し、翌13日を休館します。特別展のチケットで常設展も見ることができます。","options":["無料","2100円","900円","1200円"],"answer":3,"explanation":{"jp":"午後4時以降の料金を選ぶ。","id":"Setelah pukul 4 sore biayanya 900 yen。","point":""}},{"q":10,"section":"reading","instruction":"問題8　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"10月12日について正しいものはどれか。","stem_html":"10月12日について正しいものはどれか。","context":"美術館からのお知らせ\n市立美術館では、10月1日から特別展を行います。一般料金は1200円ですが、午後4時以降に入館する場合は900円です。毎週月曜日は休館ですが、10月12日の月曜日は祝日のため開館し、翌13日を休館します。特別展のチケットで常設展も見ることができます。","options":["常設展だけ見ることができる。","午後4時までしか入れない。","月曜日なので休館する。","祝日のため開館する。"],"answer":4,"explanation":{"jp":"祝日の月曜日は開館。","id":"Museum buka karena hari libur nasional。","point":""}},{"q":11,"section":"reading","instruction":"問題9　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"受け取り場所について、本文からわかることは何か。","stem_html":"受け取り場所について、本文からわかることは何か。","context":"図書館の予約本\n市立図書館では、借りたい本が貸出中のとき、インターネットから予約することができる。予約した本が返却されると、登録したメールアドレスに連絡が届く。連絡を受けた日を含めて7日以内に本を受け取らなければ、予約は自動的に取り消される。ただし、休館日は7日に数えない。受け取り場所は予約時に本館か駅前分館を選ぶことができ、連絡後に変更することはできない。","options":["いつでも変更できる。","本館だけで受け取れる。","本が返却されたあとに選ぶ。","予約するときに選ぶ。"],"answer":4,"explanation":{"jp":"予約時に選択、連絡後は変更不可。","id":"Lokasi dipilih saat reservasi。","point":""}},{"q":12,"section":"reading","instruction":"問題9　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"予約した本について正しいものはどれか。","stem_html":"予約した本について正しいものはどれか。","context":"図書館の予約本\n市立図書館では、借りたい本が貸出中のとき、インターネットから予約することができる。予約した本が返却されると、登録したメールアドレスに連絡が届く。連絡を受けた日を含めて7日以内に本を受け取らなければ、予約は自動的に取り消される。ただし、休館日は7日に数えない。受け取り場所は予約時に本館か駅前分館を選ぶことができ、連絡後に変更することはできない。","options":["期限までに受け取らないと予約が取り消される。","連絡が来てから7日以内なら、休館日も数える。","貸出中でない本だけ予約できる。","受け取り場所は連絡後でも変更できる。"],"answer":1,"explanation":{"jp":"期限と取り消し条件を読む。","id":"Jika tidak diambil sampai batas waktu, reservasi dibatalkan。","point":""}}],"iso":"2026-11-11","date_label":"11月11日"},{"day":77,"date":"11月12日","theme":"模試④ 聴解","target":25,"questions":[{"q":1,"section":"listening","instruction":"問題1　まず質問を聞いてください。それから話を聞いて、問題用紙の1から4の中から最もよいものを一つえらびなさい。","stem":"最後に何をしますか。","stem_html":"最後に何をしますか。","context":"","options":["結果を担当者へ送る","ファイルを開く","家へ帰る","パソコンを起動する"],"answer":1,"explanation":{"jp":"「最後に」の後が答え。","id":"Tindakan terakhir adalah setelah kata 最後に。","point":""},"audio":{"question_audio":"最後に何をしますか。","dialogue":[{"role":"female","text":"まずパソコンを起動するをしてください。そのあとファイルを開くをして、最後に結果を担当者へ送るをお願いします。"}],"spoken_options":[],"scene":"","tts":[{"role":"female","text":"まずパソコンを起動するをしてください。そのあとファイルを開くをして、最後に結果を担当者へ送るをお願いします。"},{"role":"narrator","text":"最後に何をしますか。"}]}},{"q":2,"section":"listening","instruction":"問題1　まず質問を聞いてください。それから話を聞いて、問題用紙の1から4の中から最もよいものを一つえらびなさい。","stem":"最後に何をしますか。","stem_html":"最後に何をしますか。","context":"","options":["2階へ行く","受付で名前を書く","荷物をロッカーに入れる","家へ帰る"],"answer":1,"explanation":{"jp":"「最後に」の後が答え。","id":"Tindakan terakhir adalah setelah kata 最後に。","point":""},"audio":{"question_audio":"最後に何をしますか。","dialogue":[{"role":"female","text":"まず受付で名前を書くをしてください。そのあと荷物をロッカーに入れるをして、最後に2階へ行くをお願いします。"}],"spoken_options":[],"scene":"","tts":[{"role":"female","text":"まず受付で名前を書くをしてください。そのあと荷物をロッカーに入れるをして、最後に2階へ行くをお願いします。"},{"role":"narrator","text":"最後に何をしますか。"}]}},{"q":3,"section":"listening","instruction":"問題1　まず質問を聞いてください。それから話を聞いて、問題用紙の1から4の中から最もよいものを一つえらびなさい。","stem":"最初に何をしますか。","stem_html":"最初に何をしますか。","context":"","options":["受付で名前を書く","2階へ行く","何もしない","荷物をロッカーに入れる"],"answer":1,"explanation":{"jp":"「まず」の後が最初の行動。","id":"Tin
