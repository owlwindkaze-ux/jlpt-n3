れない人は、どうすればよいか。","stem_html":"指定された時間に健康診断を受けられない人は、どうすればよいか。","context":"健康診断の時間について\n社員のみなさんへ。来週の健康診断は、午前9時から12時まで3階会議室で行います。部署ごとに受付時間が決まっていますが、仕事の都合で指定された時間に行けない場合は、前日の正午までに総務課へ連絡してください。当日は朝食を取らず、水だけ飲んで来てください。結果は約2週間後に個人へ渡します。","options":["健康診断を受けなくてよい。","2週間後に連絡する。","前日の正午までに総務課へ連絡する。","当日の朝に会議室で相談する。"],"answer":3,"explanation":{"jp":"変更連絡の期限を読み取る。","id":"Jika tidak bisa pada waktu yang ditentukan, hubungi bagian umum sebelum siang sehari sebelumnya。","point":""}},{"q":24,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"健康診断の日の朝について正しいものはどれか。","stem_html":"健康診断の日の朝について正しいものはどれか。","context":"健康診断の時間について\n社員のみなさんへ。来週の健康診断は、午前9時から12時まで3階会議室で行います。部署ごとに受付時間が決まっていますが、仕事の都合で指定された時間に行けない場合は、前日の正午までに総務課へ連絡してください。当日は朝食を取らず、水だけ飲んで来てください。結果は約2週間後に個人へ渡します。","options":["朝食も水も取ってはいけない。","結果を受け取ってから朝食を取る。","朝食は取らず、水は飲んでもよい。","いつもより多く朝食を取る。"],"answer":3,"explanation":{"jp":"朝食と水の条件を区別する。","id":"Tidak sarapan, tetapi boleh minum air。","point":""}},{"q":25,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が言いたいことは何か。","stem_html":"筆者が言いたいことは何か。","context":"買い物のメモ\n私は買い物に行く前、必要な物をスマートフォンにメモする。以前は頭の中で覚えているつもりだったが、店に着くと一つ二つ忘れることがよくあった。メモするようになってから忘れ物は減ったが、別の商品を見て予定にない物を買うことはまだある。メモは便利だが、それだけで無駄な買い物がなくなるわけではないようだ。","options":["メモは役立つが、それだけで全ての問題が解決するわけではない。","メモをすれば無駄な買い物は完全になくなる。","必要な物は頭だけで覚えるべきだ。","買い物ではスマートフォンを使わないほうがよい。"],"answer":1,"explanation":{"jp":"最後の文が筆者の主張。","id":"Catatan membantu, tetapi tidak menyelesaikan semua masalah。","point":""}},{"q":26,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"メモをするようになって、どうなったか。","stem_html":"メモをするようになって、どうなったか。","context":"買い物のメモ\n私は買い物に行く前、必要な物をスマートフォンにメモする。以前は頭の中で覚えているつもりだったが、店に着くと一つ二つ忘れることがよくあった。メモするようになってから忘れ物は減ったが、別の商品を見て予定にない物を買うことはまだある。メモは便利だが、それだけで無駄な買い物がなくなるわけではないようだ。","options":["予定にない物を全く買わなくなった。","必要な物を忘れることが減った。","スマートフォンを使わなくなった。","買い物に行かなくなった。"],"answer":2,"explanation":{"jp":"変化した点は「忘れ物が減った」。","id":"Perubahan: lebih jarang lupa barang yang dibutuhkan。","point":""}},{"q":27,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"センターの都合で教室が中止になった場合、参加費はどうなるか。","stem_html":"センターの都合で教室が中止になった場合、参加費はどうなるか。","context":"オンライン予約のキャンセル\nスポーツセンターの教室をオンラインで予約した場合、開始日の3日前まではウェブサイトから無料でキャンセルできる。2日前から前日までは電話でのみ受け付け、参加費の半額を支払う必要がある。当日のキャンセルや連絡なしの欠席では参加費の全額が必要になる。ただし、センター側の都合で中止になった場合は全額返金される。","options":["返らない。","次回だけ無料になる。","半額だけ返る。","全額返る。"],"answer":4,"explanation":{"jp":"例外条件を確認する。","id":"Jika dibatalkan oleh pusat, uang dikembalikan penuh。","point":""}},{"q":28,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"教室の2日前にキャンセルする場合、どうすればよいか。","stem_html":"教室の2日前にキャンセルする場合、どうすればよいか。","context":"オンライン予約のキャンセル\nスポーツセンターの教室をオンラインで予約した場合、開始日の3日前まではウェブサイトから無料でキャンセルできる。2日前から前日までは電話でのみ受け付け、参加費の半額を支払う必要がある。当日のキャンセルや連絡なしの欠席では参加費の全額が必要になる。ただし、センター側の都合で中止になった場合は全額返金される。","options":["電話で連絡し、参加費の半額を払う。","ウェブサイトで無料キャンセルする。","参加費の全額が返金される。","何も連絡せず欠席する。"],"answer":1,"explanation":{"jp":"2日前～前日の条件。","id":"Dua hari sebelumnya: telepon dan bayar setengah biaya。","point":""}},{"q":29,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"月の途中から定期利用を始める場合、料金はどうなるか。","stem_html":"月の途中から定期利用を始める場合、料金はどうなるか。","context":"自転車置き場の利用\n駅前の市営自転車置き場は、午前5時から翌日の午前1時まで利用できる。料金は1日100円で、定期利用の場合は1か月1800円である。定期利用を始めるには、管理室で申込書を書き、身分証明書を見せる必要がある。月の途中から申し込んでも料金は同じで、日割りにはならない。","options":["利用した日数だけ払う。","1日100円だけ払う。","1か月分1800円を払う。","半額になる。"],"answer":3,"explanation":{"jp":"日割りにならない。","id":"Biaya tetap 1 bulan penuh, tidak dihitung harian。","point":""}},{"q":30,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"定期利用を始めるために必要なものは何か。","stem_html":"定期利用を始めるために必要なものは何か。","context":"自転車置き場の利用\n駅前の市営自転車置き場は、午前5時から翌日の午前1時まで利用できる。料金は1日100円で、定期利用の場合は1か月1800円である。定期利用を始めるには、管理室で申込書を書き、身分証明書を見せる必要がある。月の途中から申し込んでも料金は同じで、日割りにはならない。","op ","授業が終わってからまとめる時間がなかったこと","大切な言葉が分からなかったこと","ノートを書くことに集中し、内容を考えにくかったこと"],"answer":4,"explanation":{"jp":"以前の問題点を問う。","id":"Masalah sebelumnya: terlalu fokus menulis sehingga sulit memahami isi。","point":""}},{"q":4,"section":"reading","instruction":"問題5　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"「私」は今の方法についてどう考えているか。","stem_html":"「私」は今の方法についてどう考えているか。","context":"メモの取り方\n私は以前、授業中に先生が言ったことをできるだけ全部ノートに書こうとしていた。しかし、書くことに集中しすぎて、説明の意味をよく考えられないことがあった。そこで最近は、大切だと思った言葉だけを書き、授業が終わってから自分の言葉で内容をまとめるようにしている。この方法に変えてから、後でノートを見たときにも内容を思い出しやすくなった。もちろん、人によって合う方法は違うが、私には今の方法のほうが合っているようだ。","options":["授業中は何も書かないほうがよいと思っている。","誰にでも一番よい方法だと思っている。","もっと全部書く練習が必要だと思っている。","以前の方法より自分には合っていると思っている。"],"answer":4,"explanation":{"jp":"最後の一文が筆者の評価。","id":"Penulis menilai cara sekarang lebih cocok baginya。","point":""}},{"q":5,"section":"reading","instruction":"問題6　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"予約した本について正しいものはどれか。","stem_html":"予約した本について正しいものはどれか。","context":"図書館の予約本\n市立図書館では、借りたい本が貸出中のとき、インターネットから予約することができる。予約した本が返却されると、登録したメールアドレスに連絡が届く。連絡を受けた日を含めて7日以内に本を受け取らなければ、予約は自動的に取り消される。ただし、休館日は7日に数えない。受け取り場所は予約時に本館か駅前分館を選ぶことができ、連絡後に変更することはできない。","options":["期限までに受け取らないと予約が取り消される。","連絡が来てから7日以内なら、休館日も数える。","貸出中でない本だけ予約できる。","受け取り場所は連絡後でも変更できる。"],"answer":1,"explanation":{"jp":"期限と取り消し条件を読む。","id":"Jika tidak diambil sampai batas waktu, reservasi dibatalkan。","point":""}},{"q":6,"section":"reading","instruction":"問題6　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"受け取り場所について、本文からわかることは何か。","stem_html":"受け取り場所について、本文からわかることは何か。","context":"図書館の予約本\n市立図書館では、借りたい本が貸出中のとき、インターネットから予約することができる。予約した本が返却されると、登録したメールアドレスに連絡が届く。連絡を受けた日を含めて7日以内に本を受け取らなければ、予約は自動的に取り消される。ただし、休館日は7日に数えない。受け取り場所は予約時に本館か駅前分館を選ぶことができ、連絡後に変更することはできない。","options":["本館だけで受け取れる。","本が返却されたあとに選ぶ。","予約するときに選ぶ。","いつでも変更できる。"],"answer":3,"explanation":{"jp":"予約時に選択、連絡後は変更不可。","id":"Lokasi dipilih saat reservasi。","point":""}},{"q":7,"section":"reading","instruction":"問題7　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"センターの都合で教室が中止になった場合、参加費はどうなるか。","stem_html":"センターの都合で教室が中止になった場合、参加費はどうなるか。","context":"オンライン予約のキャンセル\nスポーツセンターの教室をオンラインで予約した場合、開始日の3日前まではウェブサイトから無料でキャンセルできる。2日前から前日までは電話でのみ受け付け、参加費の半額を支払う必要がある。当日のキャンセルや連絡なしの欠席では参加費の全額が必要になる。ただし、センター側の都合で中止になった場合は全額返金される。","options":["半額だけ返る。","次回だけ無料になる。","全額返る。","返らない。"],"answer":3,"explanation":{"jp":"例外条件を確認する。","id":"Jika dibatalkan oleh pusat, uang dikembalikan penuh。","point":""}},{"q":8,"section":"reading","instruction":"問題7　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"教室の2日前にキャンセルする場合、どうすればよいか。","stem_html":"教室の2日前にキャンセルする場合、どうすればよいか。","context":"オンライン予約のキャンセル\nスポーツセンターの教室をオンラインで予約した場合、開始日の3日前まではウェブサイトから無料でキャンセルできる。2日前から前日までは電話でのみ受け付け、参加費の半額を支払う必要がある。当日のキャンセルや連絡なしの欠席では参加費の全額が必要になる。ただし、センター側の都合で中止になった場合は全額返金される。","options":["何も連絡せず欠席する。","ウェブサイトで無料キャンセルする。","電話で連絡し、参加費の半額を払う。","参加費の全額が返金される。"],"answer":3,"explanation":{"jp":"2日前～前日の条件。","id":"Dua hari sebelumnya: telepon dan bayar setengah biaya。","point":""}},{"q":9,"section":"reading","instruction":"問題8　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"ごみを前日の夜に出してはいけないのはなぜか。","stem_html":"ごみを前日の夜に出してはいけないのはなぜか。","context":"ごみ収集日の変更\n祝日に伴い、来週月曜日の燃えるごみの収集は火曜日に変更します。資源ごみは予定どおり水曜日です。ごみは収集日の朝8時までに決められた場所へ出してください。前日の夜に出すと、動物に荒らされることがありますのでやめてください。","options":["収集車が来ないから","場所が変わるから","資源ごみになるから","動物に荒らされることがあるから"],"answer":4,"explanation":{"jp":"理由が明記されている。","id":"Karena bisa diacak-acak hewan。","point":""}},{"q":10,"section":"reading","instruction":"問題8　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"来週の燃えるごみはいつ出すか。","stem_html":"来週の燃えるごみはいつ出すか。","context":"ごみ収集日の変更\n祝日に伴い、来週月曜日の燃えるごみの収集は火曜日に変更します。資源ごみは予定どおり水曜日です。ごみは収集日の朝8時までに決められた場所へ出してください。前日の夜に出すと、動物に荒らされることがありますのでやめてください。","options":["月曜日の夜","火曜日の朝8時まで","水曜日の朝8時まで","月曜日の朝8時まで"],"answer":2,"explanation":{"jp":"収集日変更と時間条件を合わせる。","id":"Sampah bakar: Selasa sebelum jam 8 pagi。","point":""}},{"q":11,"section":"reading","instruction":"問題9　つぎの文章を読んで、質問に答えなさい。答えは、1・ ず安いから","内容を覚えやすいから"],"answer":2,"explanation":{"jp":"旅行時の利点を問う。","id":"Keuntungannya saat bepergian: barang tidak menjadi berat。","point":""}},{"q":7,"section":"reading","instruction":"問題7　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"定期利用を始めるために必要なものは何か。","stem_html":"定期利用を始めるために必要なものは何か。","context":"自転車置き場の利用\n駅前の市営自転車置き場は、午前5時から翌日の午前1時まで利用できる。料金は1日100円で、定期利用の場合は1か月1800円である。定期利用を始めるには、管理室で申込書を書き、身分証明書を見せる必要がある。月の途中から申し込んでも料金は同じで、日割りにはならない。","options":["自転車の写真だけ","1日100円だけ","駅の切符","申込書と身分証明書"],"answer":4,"explanation":{"jp":"手続きに必要な二点を確認する。","id":"Diperlukan formulir dan identitas。","point":""}},{"q":8,"section":"reading","instruction":"問題7　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"月の途中から定期利用を始める場合、料金はどうなるか。","stem_html":"月の途中から定期利用を始める場合、料金はどうなるか。","context":"自転車置き場の利用\n駅前の市営自転車置き場は、午前5時から翌日の午前1時まで利用できる。料金は1日100円で、定期利用の場合は1か月1800円である。定期利用を始めるには、管理室で申込書を書き、身分証明書を見せる必要がある。月の途中から申し込んでも料金は同じで、日割りにはならない。","options":["半額になる。","利用した日数だけ払う。","1か月分1800円を払う。","1日100円だけ払う。"],"answer":3,"explanation":{"jp":"日割りにならない。","id":"Biaya tetap 1 bulan penuh, tidak dihitung harian。","point":""}},{"q":9,"section":"reading","instruction":"問題8　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"ごみを前日の夜に出してはいけないのはなぜか。","stem_html":"ごみを前日の夜に出してはいけないのはなぜか。","context":"ごみ収集日の変更\n祝日に伴い、来週月曜日の燃えるごみの収集は火曜日に変更します。資源ごみは予定どおり水曜日です。ごみは収集日の朝8時までに決められた場所へ出してください。前日の夜に出すと、動物に荒らされることがありますのでやめてください。","options":["場所が変わるから","動物に荒らされることがあるから","収集車が来ないから","資源ごみになるから"],"answer":2,"explanation":{"jp":"理由が明記されている。","id":"Karena bisa diacak-acak hewan。","point":""}},{"q":10,"section":"reading","instruction":"問題8　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"来週の燃えるごみはいつ出すか。","stem_html":"来週の燃えるごみはいつ出すか。","context":"ごみ収集日の変更\n祝日に伴い、来週月曜日の燃えるごみの収集は火曜日に変更します。資源ごみは予定どおり水曜日です。ごみは収集日の朝8時までに決められた場所へ出してください。前日の夜に出すと、動物に荒らされることがありますのでやめてください。","options":["水曜日の朝8時まで","月曜日の夜","月曜日の朝8時まで","火曜日の朝8時まで"],"answer":4,"explanation":{"jp":"収集日変更と時間条件を合わせる。","id":"Sampah bakar: Selasa s ":"「せっかく」は「せっかく」と書く。","id":"せっかく ditulis せっかく.","point":""}},{"q":9,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"来年はN2の試験を受ける（　　）です。","stem_html":"来年はN2の試験を受ける（　　）です。","context":"","options":["ところ","つもり","わけ","ほど"],"answer":2,"explanation":{"jp":"自分の意志＝つもり。","id":"Berniat = つもり。","point":""}},{"q":10,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"忘れない（　　）、今すぐ書いておいたほうがいいですよ。","stem_html":"忘れない（　　）、今すぐ書いておいたほうがいいですよ。","context":"","options":["まま","うちに","ほど","たびに"],"answer":2,"explanation":{"jp":"忘れる前に＝忘れないうちに。","id":"Sebelum lupa = ～うちに。","point":""}},{"q":11,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"今、昼ご飯を食べ終わった（　　）です。","stem_html":"今、昼ご飯を食べ終わった（　　）です。","context":"","options":["ところ","うち","たび","まま"],"answer":1,"explanation":{"jp":"「～たところ」＝直後。","id":"Baru saja selesai = ～たところ。","point":""}},{"q":12,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"この文法が分かりにくければ、別の例文で考えて（　　）ください。","stem_html":"この文法が分かりにくければ、別の例文で考えて（　　）ください。","context":"","options":["あって","しまって","みて","おいて"],"answer":3,"explanation":{"jp":"試しにする＝てみる。","id":"Coba lakukan = てみる。","point":""}},{"q":13,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"日本では、会社員（　　）働きながら日本語を勉強している外国人も多い。","stem_html":"日本では、会社員（　　）働きながら日本語を勉強している外国人も多い。","context":"","options":["にとって","について","によって","として"],"answer":4,"explanation":{"jp":"立場・資格を表すので「として」。","id":"Sebagai pekerja = ～として。","point":""}},{"q":14,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"毎日ニュースを聞いていたら、少しずつ内容が分かる（　　）。","stem_html":"毎日ニュースを聞いていたら、少しずつ内容が分かる（　　）。","context":"","options":["ところだった","わけではない","ようになった","ことにした"],"answer":3,"explanation":{"jp":"能力の変化は「ようになった」。","id":"Perubahan kemampuan = ようになった。","point":""}},{"q":15,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"先生が丁寧に教えてくれた（　　）、文法がよく分かるようになった。","stem_html":"先生が丁寧に教えてくれた（　　）、文法がよく分かるようになった。","context":"","options":["かわりに","せいで","たびに","おかげで"],"answer":4,"explanation":{"jp":"よい結果の原因＝おかげで。","id":"Berkat = おかげで。","point":""}},{"q":16,"section":"grammar","instruction":"問題1　つぎの文の（　　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","stem":"今日は体調が悪い（　　）、早く帰ります。","stem_html":"今日は体調が悪い（　　）、早く帰ります。","context":"","options":["ほど","しか","ので","のに"],"answer":3,"explanation":{"jp":"理由＝ので。","id":"Karena = ので。","point":""}},{"q":17,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"日曜日に働けない場合、佐藤さんは何をする必要があるか。","stem_html":"日曜日に働けない場合、佐藤さんは何をする必要があるか。","context":"アルバイトのシフト確認\n佐藤さんへ。来週のシフトについて確認です。火曜日は午後1時から6時まで、木曜日は午前10時から午後3時までお願いします。土曜日は予定表では出勤になっていますが、店の都合で休みになりました。その代わり、可能であれば日曜日の午後2時から7時までお願いしたいです。日曜日が難しい場合は、明日の正午までに返信してください。","options":["火曜日を休む。","土曜日に出勤する。","明日の正午までに返信する。","今日中に店へ行く。"],"answer":3,"explanation":{"jp":"返信期限を確認する。","id":"Jika Minggu tidak bisa, balas sebelum siang besok。","point":""}},{"q":18,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"土曜日のシフトはどうなったか。","stem_html":"土曜日のシフトはどうなったか。","context":"アルバイトのシフト確認\n佐藤さんへ。来週のシフトについて確認です。火曜日は午後1時から6時まで、木曜日は午前10時から午後3時までお願いします。土曜日は予定表では出勤になっていますが、店の都合で休みになりました。その代わり、可能であれば日曜日の午後2時から7時までお願いしたいです。日曜日が難しい場合は、明日の正午までに返信してください。","options":["日曜日と同じ時間になった。","予定どおり出勤する。","開始時刻だけ変わった。","休みになった。"],"answer":4,"explanation":{"jp":"土曜日は店の都合で休み。","id":"Hari Sabtu menjadi libur。","point":""}},{"q":19,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者が言いたいことは何か。","stem_html":"筆者が言いたいことは何か。","context":"買い物のメモ\n私は買い物に行く前、必要な物をスマートフォンにメモする。以前は頭の中で覚えているつもりだったが、店に着くと一つ二つ忘れることがよくあった。メモするようになってから忘れ物は減ったが、別の商品を見て予定にない物を買うことはまだある。メモは便利だが、それだけで無駄な買い物がなくなるわけではないようだ。","options":["メモは役立つが、それだけで全ての問題が解決するわけではない。","買い物ではスマートフォンを使わないほうがよい。","必要な物は頭だけで覚えるべきだ。","メモをすれば無駄な買い物は完全になくなる。"],"answer":1,"explanation":{"jp":"最後の文が筆者の主張。","id":"Catatan membantu, tetapi tidak menyelesaikan semua masalah。","point":""}},{"q":20,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"メモをするようになって、どうなったか。","stem_html":"メモをするようになって、どうなったか。","context":"買い物のメモ\n私は買い物に行く前、必要な物をスマートフォンにメモする。以前は頭の中で覚えているつもりだったが、店に着くと一つ二つ忘れることがよくあった。メモするようになってから忘れ物は減ったが、別の商品を見て予定にない物を買うことはまだある。メモは便利だが、それだけで無駄な買い物がなくなるわけではないようだ。","options":["買い物に行かなくなった。","予定にない物を全く買わなくなった。","必要な物を忘れることが減った。","スマートフォンを使わなくなった。"],"answer":3,"explanation":{"jp":"変化した点は「忘れ物が減った」。","id":"Perubahan: lebih jarang lupa barang yang dibutuhkan。","point":""}},{"q":21,"section":"reading","instruction":"問題4　つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","stem":"筆者の考えに合うものはどれか。","stem_html":"筆者の考えに合うものはどれか。","context":"紙の本と電子書籍\n私は小説は紙の本で読むことが多い。ページをめくりながら読んだほうが、どのあたりに何が書いてあったか思い出しやすいからだ。一方、旅行に行くときは電子書籍を使う。何冊持って行っても荷物が重くならないのが便利だからだ。どちらか一つが優れているというより、目的に合わせて使い分けるのがよいと思う。","options":["電子書籍のほうが必ず優れている。","いつでも紙の本だけを使うべきだ。","目的によって紙と電子を使い分けるとよい。","電子書籍は小説には使えない。"],"answer":3,"explanation":{"jp":"最後の文が主張。","id":"Gunakan keduanya sesuai tujuan。","point":""}}],"iso":"2026-12-05","date_label":"12月5日"}]}</script>
<script>
(()=>{
'use strict';
const DATA=JSON.parse(document.getElementById('courseData').textContent);
const DAYS=DATA.days; const DAYMAP=new Map(DAYS.map(d=>[d.day,d]));
const SECTION={vocab:'文字・語彙',grammar:'文法',reading:'読解',listening:'聴解'};
const STORAGE='jlpt_n3_100day_tablet_v2';
let store=loadStore(); let currentDay=null; let selectedMode='test'; let session=null; let tick=null; let voices=[]; let speakingToken=0;
const $=id=>document.getElementById(id);
function defaultStore(){return {currentProfile:'学習者',profiles:{'学習者':{attempts:{},drafts:{}}},prefs:{rate:1,narrator:'',female:'',male:''}}}
function loadStore(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');return x&&x.profiles?x:defaultStore()}catch(e){return defaultStore()}}
function saveStore(){try{localStorage.setItem(STORAGE,JSON.stringify(store))}catch(e){/* file環境で保存不可でも学習は継続 */}}
function profile(){const n=store.currentProfile||'学習者'; if(!store.profiles[n])store.profiles[n]={attempts:{},drafts:{}}; return store.profiles[n]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2300)}
function weekOf(d){return d<=7?1:Math.floor((d-1)/7)+1}
function bestAttempt(day){const a=profile().attempts[day]||[];if(!a.length)return null;return [...a].sort((x,y)=>(y.percent-x.percent)||((x.elapsedSec||999999)-(y.elapsedSec||999999)))[0]}
function latestAttempt(day){const a=profile().attempts[day]||[];return a.length?a[a.length-1]:null}
function home(){cancelSpeech();clearInterval(tick);tick=null;session=null;currentDay=null;$('dayView').classList.add('hidden');$('homeView').classList.remove('hidden');renderHome()}
function renderHome(){
 $('profileName').value=store.currentProfile||'学習者';
 const completed=DAYS.filter(d=>bestAttempt(d.day)).length; const bests=DAYS.map(d=>bestAttempt(d.day)).filter(Boolean);
 const avg=bests.length?Math.round(bests.reduce((s,a)=>s+a.percent,0)/bests.length):0; const totalSec=bests.reduce((s,a)=>s+(a.elapsedSec||0),0);
 const secAgg={vocab:[0,0],grammar:[0,0],reading:[0,0],listening:[0,0]};
 bests.forEach(a=>Object.entries(a.sectionScores||{}).forEach(([k,v])=>{secAgg[k][0]+=v.correct;secAgg[k][1]+=v.total}));
 let weak='―', weakPct=101; Object.entries(secAgg).forEach(([k,[c,t]])=>{if(t){const p=c/t*100;if(p<weakPct){weakPct=p;weak=SECTION[k]+' '+Math.round(p)+'%'}}});
 $('stats').innerHTML=[['完了Day',completed+' / 100'],['平均最高正答率',avg+'%'],['累計解答時間',Math.floor(totalSec/3600)+'時間 '+Math.floor(totalSec%3600/60)+'分'],['現在の弱点',weak]].map(x=>`<div class="card stat"><div class="num">${esc(x[1])}</div><div class="label">${esc(x[0])}</div></div>`).join('');
 $('progressBar').style.width=completed+'%';$('progressText').textContent=`進捗 ${completed}%（${completed}日完了）`;
 const today=new Date(); const iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0'); const td=DAYS.find(d=>d.iso===iso);
 if(td){$('todayBox').classList.remove('hidden');$('todayBox').innerHTML=`<div class="paneltitle">今日の予定：Day ${td.day}</div><div>${esc(td.date_label)}　${esc(td.theme)}　<span class="pill">目標 ${td.target}分</span></div><div style="margin-top:10px"><button class="btn primary" data-open-day="${td.day}">今日の学習を開く</button></div>`}else $('todayBox').classList.add('hidden');
 const filter=$('dayFilter').value; let html='';
 for(let w=1;w<=15;w++){const ds=DAYS.filter(d=>weekOf(d.day)===w).filter(d=>filter==='all'||(filter==='unfinished'&&!bestAttempt(d.day))||(filter==='completed'&&bestAttempt(d.day)));if(!ds.length)continue;html+=`<section class="week"><div class="weekhead"><h2>第${w}週</h2><span class="note">Day ${ds[0].day}～${ds[ds.length-1].day}</span></div><div class="days">`;
 ds.forEach(d=>{const b=bestAttempt(d.day), draft=profile().drafts[d.day];const cls=['daycard'];if(b)cls.push('done');if(d.iso===iso)cls.push('today');html+=`<button class="${cls.join(' ')}" data-open-day="${d.day}" type="button"><div class="dtitle">Day ${d.day} <span class="note">${esc(d.date_label)}</span></div><div class="theme">${esc(d.theme)}</div><div class="meta">目標 ${d.target}分・${d.questions.length}問 ${draft?'・途中':''}</div>${b?`<div class="score">最高 ${b.score}/${b.total}（${b.percent}%）・${fmtTime(b.elapsedSec)}</div>`:''}</button>`});html+='</div></section>'}
 $('weeks').innerHTML=html;
}
function openDay(day){currentDay=DAYMAP.get(Number(day)); if(!currentDay)return; $('homeView').classList.add('hidden');$('dayView').classList.remove('hidden');$('quizPanel').classList.add('hidden');$('resultPanel').classList.add('hidden');$('startPanel').classList.remove('hidden');$('dayDate').textContent=`Day ${currentDay.day}・${currentDay.date_label}`;$('dayTarget').textContent=`目標 ${currentDay.target}分`;$('dayTitle').textContent=currentDay.theme;$('daySub').textContent=`${currentDay.questions.length}問／${currentDay.questions.some(q=>q.audio)?'聴解あり':'聴解なし'}／試験モードでは最後にまとめて採点`;$('timer').textContent='00:00';$('timer').classList.remove('over');$('timerGoal').textContent=`目標 ${currentDay.target}:00`;const draft=profile().drafts[currentDay.day];$('resumeBtn').classList.toggle('hidden',!draft);$('discardDraftBtn').classList.toggle('hidden',!draft);setMode('test');window.scrollTo({top:0,behavior:'smooth'})}
function setMode(m){selectedMode=m;document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m))}
function startDay(resume=false){cancelSpeech();const d=currentDay;if(!d)return;let draft=resume?profile().drafts[d.day]:null;if(draft){session={day:d.day,mode:draft.mode||selectedMode,answers:draft.answers||{},startedAt:draft.startedAt||Date.now(),index:draft.index||0,audioPlays:draft.audioPlays||{}};setMode(session.mode)}else{session={day:d.day,mode:selectedMode,answers:{},startedAt:Date.now(),index:0,audioPlays:{}}}saveDraft();$('startPanel').classList.add('hidden');$('quizPanel').classList.remove('hidden');$('resultPanel').classList.add('hidden');startTimer();renderQuestion()}
function saveDraft(){if(!session)return;profile().drafts[session.day]={mode:session.mode,answers:session.answers,startedAt:session.startedAt,index:session.index,audioPlays:session.audioPlays};saveStore()}
function discardDraft(){if(!currentDay)return;delete profile().drafts[currentDay.day];saveStore();$('resumeBtn').classList.add('hidden');$('discardDraftBtn').classList.add('hidden');toast('途中データを削除しました')}
function startTimer(){clearInterval(tick);const update=()=>{if(!session)return;const sec=Math.floor((Date.now()-session.startedAt)/1000);$('timer').textContent=fmtTime(sec);$('timer').classList.toggle('over',sec>currentDay.target*60)};update();tick=setInterval(update,1000)}
function renderQuestion(){cancelSpeech();const d=currentDay,q=d.questions[session.index];$('qCounter').textContent=`${session.index+1} / ${d.questions.length}`;$('sectionChip').textContent=SECTION[q.section]||q.section;$('instruction').textContent=q.instruction||'';$('stem').innerHTML=q.stem_html||esc(q.stem);$('passage').classList.toggle('hidden',!q.context);$('passage').textContent=q.context||'';$('sceneImg').classList.toggle('hidden',!q.image);if(q.image)$('sceneImg').src=q.image;const hasAudio=!!q.audio;$('audioBox').classList.toggle('hidden',!hasAudio);if(hasAudio)updateAudioStatus(q);const opts=$('options');opts.className='options'+(q.audio_only?' audioOnly':'');opts.innerHTML='';q.options.forEach((op,i)=>{const num=i+1,b=document.createElement('button');b.type='button';b.className='option';if(session.answers[q.q]===num)b.classList.add('selected');if(session.mode==='study'&&session.answers[q.q]){if(num===q.answer)b.classList.add('correct');if(session.answers[q.q]===num&&num!==q.answer)b.classList.add('incorrect')}b.innerHTML=`<span class="onum">${num}</span><span>${q.audio_only?'':esc(op)}</span>`;b.addEventListener('click',()=>choose(num));opts.appendChild(b)});$('feedback').classList.add('hidden');if(session.mode==='study'&&session.answers[q.q])showFeedback(q,session.answers[q.q]);$('prevBtn').disabled=session.index===0;$('nextBtn').disabled=session.index===d.questions.length-1;renderQGrid();$('answerProgress').textContent=`回答済み ${Object.keys(session.answers).length} / ${d.questions.length}`;saveDraft();window.scrollTo({top:document.querySelector('.daytop').offsetTop-8,behavior:'smooth'})}
function choose(num){const q=currentDay.questions[session.index];session.answers[q.q]=num;saveDraft();renderQuestion()}
function renderQGrid(){const box=$('qgrid');box.innerHTML='';currentDay.questions.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='qnum';b.textContent=q.q;if(session.answers[q.q])b.classList.add('answered');if(i===session.index)b.classList.add('current');b.addEventListener('click',()=>{session.index=i;renderQuestion()});box.appendChild(b)})}
function showFeedback(q,ans){const good=ans===q.answer,ex=q.explanation||{};const op=q.options[q.answer-1]||'';$('feedback').className='feedback '+(good?'good':'bad');$('feedback').innerHTML=`<strong>${good?'○ 正解':'× 不正解'}　正解：${q.answer}${q.audio_only?'':' '+esc(op)}</strong>${ex.jp?`<div style="margin-top:7px">${esc(ex.jp)}</div>`:''}${ex.id?`<div class="id"><strong>Indonesia:</strong> ${esc(ex.id)}</div>`:''}${ex.point?`<div class="point">指導ポイント：${esc(ex.point)}</div>`:''}`}
function grade(){const d=currentDay;const unanswered=d.questions.filter(q=>!session.answers[q.q]);if(unanswered.length&&!confirm(`未回答が ${unanswered.length} 問あります。このまま採点しますか？`))return;cancelSpeech();clearInterval(tick);const elapsed=Math.floor((Date.now()-session.startedAt)/1000);let correct=0;const wrong=[],sectionScores={};Object.keys(SECTION).forEach(k=>sectionScores[k]={correct:0,total:0});d.questions.forEach(q=>{const a=session.answers[q.q]||0;sectionScores[q.section].total++;if(a===q.answer){correct++;sectionScores[q.section].correct++}else wrong.push(q.q)});const total=d.questions.length,percent=Math.round(correct/total*100);const attempt={at:new Date().toISOString(),score:correct,total,percent,elapsedSec:elapsed,targetMin:d.target,mode:session.mode,wrong,sectionScores};if(!profile().attempts[d.day])profile().attempts[d.day]=[];profile().attempts[d.day].push(attempt);delete profile().drafts[d.day];saveStore();$('quizPanel').classList.add('hidden');$('resultPanel').classList.remove('hidden');renderResult(attempt);session=null}
function renderResult(a){const d=currentDay;let b='';Object.entries(a.sectionScores).filter(([k,v])=>v.total).forEach(([k,v])=>{b+=`<div class="break"><strong>${SECTION[k]}</strong><br>${v.correct}/${v.total}（${Math.round(v.correct/v.total*100)}%）</div>`});let wrong='';a.wrong.forEach(qn=>{const q=d.questions.find(x=>x.q===qn),ex=q.explanation||{};wrong+=`<details><summary>問題${qn}　正解 ${q.answer}${q.audio_only?'':'：'+esc(q.options[q.answer-1]||'')}</summary>${q.context?`<div class="passage" style="margin-top:8px">${esc(q.context)}</div>`:''}<div style="margin-top:8px">${q.stem_html||esc(q.stem)}</div>${ex.jp?`<div style="margin-top:8px">${esc(ex.jp)}</div>`:''}${ex.id?`<div class="id"><strong>Indonesia:</strong> ${esc(ex.id)}</div>`:''}</details>`});$('resultPanel').innerHTML=`<h2>Day ${d.day} 結果</h2><div class="scorebig">${a.score} / ${a.total}　${a.percent}%</div><div>所要時間：${fmtTime(a.elapsedSec)}　／　目標：${d.target}:00　<span class="pill">${a.elapsedSec<=d.target*60?'時間内':'目標時間超過'}</span></div><div class="breakdown">${b}</div><div class="paneltitle">間違えた問題 ${a.wrong.length}問</div><div class="wronglist">${wrong||'<div class="feedback good">全問正解です。</div>'}</div><div class="btnrow" style="margin-top:14px"><button class="btn primary" data-retry="1">もう一度解く</button><button class="btn" data-home="1">ホームへ戻る</button></div>`;window.scrollTo({top:0,behavior:'smooth'})}
function maxAudioPlays(){if(session&&session.mode==='study')return 99;return currentDay.day<=45?2:1}
function updateAudioStatus(q){const used=session?(session.audioPlays[q.q]||0):0,max=maxAudioPlays();$('audioStatus').textContent=max===99?`学習モード：繰り返し再生できます（${used}回再生）`:`再生 ${used}/${max}回（${currentDay.day<=45?'前半は最大2回':'本番期は1回'}）`;$('audioBtn').disabled=max!==99&&used>=max}
function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices();const jp=voices.filter(v=>/^ja/i.test(v.lang)||/Japanese|日本/i.test(v.name));const list=jp.length?jp:voices;[['voiceNarrator','narrator'],['voiceFemale','female'],['voiceMale','male']].forEach(([id,key])=>{const el=$(id);el.innerHTML='';list.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=`${v.name} (${v.lang})`;el.appendChild(o)});let desired=store.prefs[key];if(desired&&list.some(v=>v.name===desired))el.value=desired;else if(list[0])el.value=list[0].name});if(list.length>1&&!store.prefs.female)$('voiceFemale').selectedIndex=0;if(list.length>1&&!store.prefs.male)$('voiceMale').selectedIndex=Math.min(1,list.length-1)}
function voiceFor(role){const id=role==='female'?'voiceFemale':role==='male'?'voiceMale':'voiceNarrator';const name=$(id).value;return voices.find(v=>v.name===name)||voices.find(v=>/^ja/i.test(v.lang))||voices[0]}
function cancelSpeech(){speakingToken++;if('speechSynthesis'in window)speechSynthesis.cancel()}
function speakOne(part,token){return new Promise(resolve=>{if(token!==speakingToken||!('speechSynthesis'in window))return resolve();const u=new SpeechSynthesisUtterance(part.text);u.lang='ja-JP';u.rate=Number($('speechRate').value||1);const v=voiceFor(part.role||'narrator');if(v)u.voice=v;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}
function pause(ms){return new Promise(r=>setTimeout(r,ms))}
async function playAudio(){const q=currentDay.questions[session.index];if(!q.audio)return;const max=maxAudioPlays(),used=session.audioPlays[q.q]||0;if(max!==99&&used>=max){toast('この問題の再生回数を使い切りました');return}session.audioPlays[q.q]=used+1;saveDraft();updateAudioStatus(q);cancelSpeech();const token=speakingToken;$('audioBtn').disabled=true;$('audioStatus').textContent='再生中…';for(const part of (q.audio.tts||[])){if(token!==speakingToken)break;await speakOne(part,token);await pause(220)}if(token===speakingToken)updateAudioStatus(q)}
function download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const rows=[['学習者','Day','日付','テーマ','実施日時','得点','問題数','正答率','所要秒','目標分','モード','誤答番号']];const n=store.currentProfile;DAYS.forEach(d=>(profile().attempts[d.day]||[]).forEach(a=>rows.push([n,d.day,d.date_label,d.theme,a.at,a.score,a.total,a.percent,a.elapsedSec,a.targetMin,a.mode,(a.wrong||[]).join(' ')])));const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`JLPT_N3_${n}_学習履歴.csv`,csv,'text/csv;charset=utf-8')}
function exportJSON(){download(`JLPT_N3_${store.currentProfile}_バックアップ.json`,JSON.stringify(store,null,2),'application/json;charset=utf-8')}
function importJSON(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.profiles)throw new Error();store=x;saveStore();renderHome();toast('バックアップを読み込みました')}catch(e){alert('このファイルは読み込めません。')}};r.readAsText(file)}
function resetCurrent(){if(confirm(`${store.currentProfile} の学習履歴と途中データをすべて削除しますか？`)){store.profiles[store.currentProfile]={attempts:{},drafts:{}};saveStore();renderHome()}}

// events
document.addEventListener('click',e=>{const od=e.target.closest('[data-open-day]');if(od){openDay(od.dataset.openDay);return}if(e.target.closest('[data-home]')){home();return}if(e.target.closest('[data-retry]')){openDay(currentDay.day);return}});
$('homeBtn').addEventListener('click',home);$('dayFilter').addEventListener('change',renderHome);$('profileApply').addEventListener('click',()=>{const n=$('profileName').value.trim()||'学習者';store.currentProfile=n;if(!store.profiles[n])store.profiles[n]={attempts:{},drafts:{}};saveStore();renderHome();toast(`${n} に切り替えました`)});document.querySelectorAll('.modebtn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('startBtn').addEventListener('click',()=>startDay(false));$('resumeBtn').addEventListener('click',()=>startDay(true));$('discardDraftBtn').addEventListener('click',discardDraft);$('prevBtn').addEventListener('click',()=>{if(session.index>0){session.index--;renderQuestion()}});$('nextBtn').addEventListener('click',()=>{if(session.index<currentDay.questions.length-1){session.index++;renderQuestion()}});$('submitBtn').addEventListener('click',grade);$('audioBtn').addEventListener('click',playAudio);$('audioStopBtn').addEventListener('click',()=>{cancelSpeech();const q=currentDay.questions[session.index];updateAudioStatus(q)});$('csvBtn').addEventListener('click',exportCSV);$('jsonBtn').addEventListener('click',exportJSON);$('importFile').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});$('resetBtn').addEventListener('click',resetCurrent);
$('settingsBtn').addEventListener('click',()=>{$('settingsModal').classList.remove('hidden');loadVoices()});$('settingsClose').addEventListener('click',()=>{$('settingsModal').classList.add('hidden');store.prefs.rate=Number($('speechRate').value);store.prefs.narrator=$('voiceNarrator').value;store.prefs.female=$('voiceFemale').value;store.prefs.male=$('voiceMale').value;saveStore()});$('voiceTestBtn').addEventListener('click',async()=>{cancelSpeech();const token=speakingToken;await speakOne({role:'female',text:'日本語の音声テストです。'},token);await speakOne({role:'male',text:'男性の音声テストです。'},token)});$('speechRate').addEventListener('change',()=>{store.prefs.rate=Number($('speechRate').value);saveStore()});
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,300)}$('speechRate').value=String(store.prefs.rate||1);renderHome();
})();
</script>
</body>
